# 生产部署（单机 4C6G，5 人以内）
# 相比 docker-compose-app.yml 的差异：
#   - RabbitMQ 是唯一异步任务引擎
#   - 依赖服务（mysql/redis/es/minio/rabbitmq）不发布宿主机端口，仅走内网
#   - 核心常驻容器硬上限合计 3136 MiB；叠加完整观测后合计 4608 MiB
#   - Prometheus/Grafana/轻量 ELK 由 docker-compose-observability.yml 叠加
#   - app 显式限制 heap/direct/metaspace/code cache，避免只限制堆后被 native memory 顶穿
#   - 新增 Caddy 终止 HTTPS（自动 Let's Encrypt），反代到 frontend:80
#
# 用法（在服务器上，dev-ops 目录）：
#   cp .env.prod.example .env   # 然后填好所有必填项
#   docker compose --env-file .env -f docker-compose-prod.yml \
#     -f docker-compose-observability.yml --profile logs up -d --build
#
# 注意：Linux 上 ES 需要 sudo sysctl -w vm.max_map_count=262144（见 DEPLOY.md）

name: ai-interview

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置强密码}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_interview}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置强密码}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
    mem_limit: 384m
    cpus: 0.60
    logging: *container-logging
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --protocol=TCP -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7
    container_name: interview-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m
    cpus: 0.20
    logging: *container-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: interview-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms384m -Xmx384m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    mem_limit: 1024m
    cpus: 1.00
    logging: *container-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: interview-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 设置}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 设置强密码}
    volumes:
      - minio_data:/data
    mem_limit: 256m
    cpus: 0.35
    logging: *container-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  createbuckets:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    # 仅建桶，不设匿名公开读（桶内含简历/资料 PII，一律走后端鉴权/预签名）
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET:-ai-interview}
      "
    mem_limit: 64m
    cpus: 0.10
    logging: *container-logging

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: interview-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ai_interview}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 设置强密码}
      # RabbitMQ 3.13 已拒绝旧的 RABBITMQ_VM_MEMORY_HIGH_WATERMARK 环境变量；
      # 低并发 4C6G 部署保留镜像默认的保守内存水位。
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 256m
    cpus: 0.35
    logging: *container-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: interview-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8080
      JAVA_OPTS: "-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai -Xms192m -Xmx448m -XX:MaxDirectMemorySize=64m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?必填：≥32 字节强随机}
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY:?必填：BYOK 加密密钥，启用后勿改}
      APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY: "true"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ai_interview}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_HOST: http://elasticsearch:9200
      ES_INDEX_NAME: ai-interview-vector
      ES_DIMENSIONS: ${ES_DIMENSIONS:-1536}
      # FileStorageService 使用 minio.* 配置，必须显式指向容器内 MinIO 服务
      MINIO_URL: http://minio:9000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:?必填：MinerU 可访问的 HTTPS 文件域名}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-interview}
      # 平台全局 Embedding / 云 Rerank Key；用户发起的 Chat 优先使用其 BYOK。
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY:?必填：全局 embedding 用的 DashScope Key}
      AI_MODEL: ${AI_MODEL:-qwen3.5-flash}
      MINERU_ENABLED: ${MINERU_ENABLED:-true}
      MINERU_BASE_URL: ${MINERU_BASE_URL:-https://mineru.net}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:?必填：MinerU 官方 API Token}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_POLL_INTERVAL_MS: ${MINERU_POLL_INTERVAL_MS:-2000}
      MINERU_TASK_TIMEOUT_SECONDS: ${MINERU_TASK_TIMEOUT_SECONDS:-300}
      MINERU_PRESIGNED_URL_TTL_SECONDS: ${MINERU_PRESIGNED_URL_TTL_SECONDS:-600}
      # 唯一异步引擎：RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ai_interview}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # CORS：填写浏览器实际访问的 HTTPS origin，禁止回退到源码内的示例域名。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?必填：例如 https://interview.example.com}
      # 4C6G 生产基线：hybrid + RRF + 云端 rerank + small-to-big。
      APP_AI_RAG_RERANK_PROVIDER: cloud
      APP_AI_RAG_CRAG_ENABLED: "false"
      GITHUB_ENABLED: ${GITHUB_ENABLED:-true}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_PUBLIC_TOKEN: ${GITHUB_PUBLIC_TOKEN:-}
      GITHUB_SYNC_MAX_FILES: ${GITHUB_SYNC_MAX_FILES:-120}
      GITHUB_SYNC_MAX_BYTES: ${GITHUB_SYNC_MAX_BYTES:-10485760}
      # 官方 MCP 未配置时固定为 false，运行时自动回退固定 SHA 快照。
      GITHUB_MCP_ENABLED: ${GITHUB_MCP_ENABLED:-false}
      GITHUB_MCP_ENDPOINT: ${GITHUB_MCP_ENDPOINT:-https://api.githubcopilot.com/mcp/}
      GITHUB_MCP_ACCESS_TOKEN: ${GITHUB_MCP_ACCESS_TOKEN:-}
      GITHUB_MCP_MAX_RESPONSE_BYTES: ${GITHUB_MCP_MAX_RESPONSE_BYTES:-1048576}
      # Judge0 未配置时保持 false；系统只记录待补判，不让 LLM 冒充执行器。
      JUDGE0_ENABLED: ${JUDGE0_ENABLED:-false}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_API_HOST: ${JUDGE0_API_HOST:-}
      JUDGE0_CONNECT_TIMEOUT_MS: ${JUDGE0_CONNECT_TIMEOUT_MS:-5000}
      JUDGE0_REQUEST_TIMEOUT_MS: ${JUDGE0_REQUEST_TIMEOUT_MS:-10000}
      JUDGE0_JAVA_LANGUAGE_ID: ${JUDGE0_JAVA_LANGUAGE_ID:-}
      JUDGE0_PYTHON3_LANGUAGE_ID: ${JUDGE0_PYTHON3_LANGUAGE_ID:-}
      JUDGE0_POLL_INTERVAL_MS: ${JUDGE0_POLL_INTERVAL_MS:-1000}
      JUDGE0_TIMEOUT_SECONDS: ${JUDGE0_TIMEOUT_SECONDS:-30}
      JUDGE0_CPU_TIME_LIMIT_SECONDS: ${JUDGE0_CPU_TIME_LIMIT_SECONDS:-3}
      JUDGE0_MEMORY_LIMIT_KB: ${JUDGE0_MEMORY_LIMIT_KB:-262144}
      LOGGING_FILE_NAME: /app/logs/app.json
    volumes:
      - app_logs:/app/logs
    mem_limit: 896m
    cpus: 1.50
    logging: *container-logging
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ../frontend
    container_name: interview-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 96m
    cpus: 0.20
    logging: *container-logging
    healthcheck:
      # 自定义 nginx.conf 只声明 IPv4 listen；避免 Alpine wget 将 localhost 解析到 ::1。
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 不发布宿主机端口，由 Caddy 内网转发（frontend nginx 已内建 /api 反代到 app:8080）

  caddy:
    image: caddy:2
    container_name: interview-caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?请在 .env 设置应用域名}
      FILES_DOMAIN: ${FILES_DOMAIN:?请在 .env 设置文件域名}
      ACME_EMAIL: ${ACME_EMAIL:?请在 .env 设置 ACME 邮箱}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    cpus: 0.20
    logging: *container-logging
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  app_logs:
  caddy_data:
  caddy_config:
