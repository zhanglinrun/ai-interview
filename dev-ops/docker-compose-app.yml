# 全栈容器化部署（基础设施 + 后端 + 前端）
# 用法：
#   cd dev-ops
#   docker compose -f docker-compose-app.yml up -d --build
#
# name 显式钉死，防止与 ai-group 的 docs/dev-ops compose 撞默认项目名 "dev-ops"（详见
# docker-compose-environment.yml 头注）。

name: ai-interview

services:
  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # 应用栈使用独立 V2 数据库，避免复用旧版本卷中的表结构和数据。
      MYSQL_DATABASE: ${APP_MYSQL_DB:-ai_interview_v2}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_interview}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${MYSQL_HOST_PORT:-33306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 强制探测 TCP 3306，避免首次初始化时把仅开放 Unix Socket 的临时 server
      # 误判为 ready，导致 app 在正式 MySQL 重启窗口内连接失败后退出。
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: interview-redis
    ports:
      - "${REDIS_HOST_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: interview-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_HOST_PORT:-29200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: interview-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_HOST_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-29001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: interview-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Neo4j 图检索：对应 RAG 的 Text2Cypher 数据源。
  neo4j:
    image: neo4j:5.26-community
    container_name: interview-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-neo4j-password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_BOLT_HOST_PORT:-27687}:7687"
      - "${NEO4J_HTTP_HOST_PORT:-27474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # XXL-Job 仅负责补偿任务调度，业务数据仍在 ai_interview_v2 库中。
  xxl-job-mysql:
    image: mysql:8.0
    container_name: interview-xxl-job-mysql
    environment:
      MYSQL_DATABASE: xxl_job
      MYSQL_USER: xxl_job
      MYSQL_PASSWORD: ${XXL_JOB_MYSQL_PASSWORD:-xxl_job_dev}
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_ROOT_PASSWORD:-xxl_job_root_dev}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - xxl_job_mysql_data:/var/lib/mysql
      - ./docker/xxl-job/tables_xxl_job.sql:/docker-entrypoint-initdb.d/01-tables_xxl_job.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: interview-xxl-job-admin
    depends_on:
      xxl-job-mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=xxl_job
        --spring.datasource.password=${XXL_JOB_MYSQL_PASSWORD:-xxl_job_dev}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-local_xxl_token}
    ports:
      - "${XXL_JOB_ADMIN_HOST_PORT:-28081}:8080"
    volumes:
      - xxl_job_admin_logs:/data/applogs
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: interview-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      xxl-job-admin:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      # Provider 密钥使用独立加密密钥；登录会话由 Sa-Token + Redis 管理
      # 开发编排使用固定本地默认值；生产 compose 仍要求显式配置强随机密钥。
      # 与 ApiKeyEncryptionService 的本地开发回退值保持一致；生产 Compose 仍要求显式注入密钥。
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY:-ai-interview-dev-only-provider-api-key-encryption}
      APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${APP_MYSQL_DB:-ai_interview_v2}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_interview}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_HOST: http://elasticsearch:9200
      ES_INDEX_NAME: ai-interview-vector
      ES_DIMENSIONS: ${ES_DIMENSIONS:-1536}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ai-interview
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen3.5-flash}
      MINERU_ENABLED: ${MINERU_ENABLED:-true}
      MINERU_BASE_URL: ${MINERU_BASE_URL:-https://mineru.net}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_POLL_INTERVAL_MS: ${MINERU_POLL_INTERVAL_MS:-2000}
      MINERU_TASK_TIMEOUT_SECONDS: ${MINERU_TASK_TIMEOUT_SECONDS:-300}
      MINERU_PRESIGNED_URL_TTL_SECONDS: ${MINERU_PRESIGNED_URL_TTL_SECONDS:-600}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-true}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_PUBLIC_TOKEN: ${GITHUB_PUBLIC_TOKEN:-}
      GITHUB_SYNC_MAX_FILES: ${GITHUB_SYNC_MAX_FILES:-120}
      GITHUB_SYNC_MAX_BYTES: ${GITHUB_SYNC_MAX_BYTES:-10485760}
      GITHUB_MCP_ENABLED: ${GITHUB_MCP_ENABLED:-false}
      GITHUB_MCP_ENDPOINT: ${GITHUB_MCP_ENDPOINT:-https://api.githubcopilot.com/mcp/}
      GITHUB_MCP_ACCESS_TOKEN: ${GITHUB_MCP_ACCESS_TOKEN:-}
      GITHUB_MCP_MAX_RESPONSE_BYTES: ${GITHUB_MCP_MAX_RESPONSE_BYTES:-1048576}
      JUDGE0_ENABLED: ${JUDGE0_ENABLED:-false}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_API_HOST: ${JUDGE0_API_HOST:-}
      JUDGE0_CONNECT_TIMEOUT_MS: ${JUDGE0_CONNECT_TIMEOUT_MS:-5000}
      JUDGE0_REQUEST_TIMEOUT_MS: ${JUDGE0_REQUEST_TIMEOUT_MS:-10000}
      JUDGE0_JAVA_LANGUAGE_ID: ${JUDGE0_JAVA_LANGUAGE_ID:-}
      JUDGE0_PYTHON3_LANGUAGE_ID: ${JUDGE0_PYTHON3_LANGUAGE_ID:-}
      JUDGE0_POLL_INTERVAL_MS: ${JUDGE0_POLL_INTERVAL_MS:-1000}
      JUDGE0_TIMEOUT_SECONDS: ${JUDGE0_TIMEOUT_SECONDS:-30}
      JUDGE0_CPU_TIME_LIMIT_SECONDS: ${JUDGE0_CPU_TIME_LIMIT_SECONDS:-3}
      JUDGE0_MEMORY_LIMIT_KB: ${JUDGE0_MEMORY_LIMIT_KB:-262144}
      APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
      APP_INTERVIEW_EVALUATION_BATCH_SIZE: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:-8}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      APP_JOB_XXL_ENABLED: ${APP_JOB_XXL_ENABLED:-true}
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_APP_NAME: ${XXL_JOB_APP_NAME:-ai-interview-backend}
      XXL_JOB_EXECUTOR_ADDRESS: ${XXL_JOB_EXECUTOR_ADDRESS:-http://app:9999/}
      XXL_JOB_EXECUTOR_IP: ${XXL_JOB_EXECUTOR_IP:-}
      XXL_JOB_EXECUTOR_PORT: ${XXL_JOB_EXECUTOR_PORT:-9999}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:-local_xxl_token}
      XXL_JOB_LOG_PATH: /app/logs/xxl-job
      XXL_JOB_LOG_RETENTION_DAYS: ${XXL_JOB_LOG_RETENTION_DAYS:-30}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      APP_AI_RAG_NEO4J_ENABLED: ${APP_AI_RAG_NEO4J_ENABLED:-true}
      APP_AI_RAG_NEO4J_SEED_ENABLED: ${APP_AI_RAG_NEO4J_SEED_ENABLED:-true}
      APP_AI_RAG_NEO4J_PLATFORM_OWNER_ID: ${APP_AI_RAG_NEO4J_PLATFORM_OWNER_ID:-0}
      APP_AI_RAG_NEO4J_KB_SCOPE_REQUIRED: ${APP_AI_RAG_NEO4J_KB_SCOPE_REQUIRED:-false}
      APP_AI_RAG_NEO4J_USER_SCOPE_REQUIRED: ${APP_AI_RAG_NEO4J_USER_SCOPE_REQUIRED:-true}
      APP_AI_RAG_NEO4J_USER_SCOPE_PROPERTY: ${APP_AI_RAG_NEO4J_USER_SCOPE_PROPERTY:-ownerUserId}
    expose:
      - "9999"
    ports:
      - "${APP_HOST_PORT:-28082}:8080"
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  frontend:
    build: ../frontend
    container_name: interview-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-28080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  neo4j_data:
  neo4j_logs:
  xxl_job_mysql_data:
  xxl_job_admin_logs:
  app_logs:
