input {
  file {
    path => "/var/log/ai-interview/app.json"
    mode => "tail"
    start_position => "end"
    sincedb_path => "/usr/share/logstash/data/app-log.sincedb"
    codec => json {
      ecs_compatibility => disabled
    }
  }
}

filter {
  # Keep the operational event, but strip fields that could contain full user
  # content. The application must still avoid logging prompts, answers, source
  # code, hidden tests, signed URLs and credentials in the first place.
  mutate {
    remove_field => [
      "apiKey", "api_key", "authorization", "password", "secret", "token",
      "accessToken", "refreshToken", "access_token", "refresh_token",
      "cookie", "set-cookie", "headers", "requestBody", "responseBody",
      "prompt", "answer", "resume", "document", "documentContent", "jdText",
      "sourceCode", "source_code", "hiddenTests", "hidden_tests",
      "signedUrl", "presignedUrl", "event.original", "[event][original]", "@version"
    ]
    gsub => [
      "message", "(?i)(api[_-]?key|authorization|password|secret|token)(\\s*[:=]\\s*)[^,;\\s]+", "\\1\\2[REDACTED]",
      "message", "(https?://[^?\\s]+)\\?[^\\s]+", "\\1?[REDACTED]",
      "stack_trace", "(?i)(api[_-]?key|authorization|password|secret|token)(\\s*[:=]\\s*)[^,;\\s]+", "\\1\\2[REDACTED]",
      "stack_trace", "(https?://[^?\\s]+)\\?[^\\s]+", "\\1?[REDACTED]"
    ]
  }

  ruby {
    code => '
      message = event.get("message")
      event.set("message", message[0, 2000]) if message.is_a?(String) && message.length > 2000
      stack = event.get("stack_trace")
      event.set("stack_trace", stack[0, 8000]) if stack.is_a?(String) && stack.length > 8000
      event.set("service", "ai-interview-backend")
    '
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ai-interview-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
