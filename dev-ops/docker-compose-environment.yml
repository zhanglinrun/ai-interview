# 本地开发依赖服务（对齐 agent-group docs/dev-ops 约定）
# 用法：
#   cd dev-ops
#   docker compose -f docker-compose-environment.yml up -d
# 或在项目根目录：
#   docker compose -f docker-compose.dev.yml up -d
#
# 宿主机端口刻意避开 agent-group（13306/16379/19200/9000/18081 等）及常见默认端口。
#
# name 显式钉死：ai-group 的 compose 也在各自 docs/dev-ops 目录下运行，默认项目名同为
# "dev-ops"，会互相识别成同一项目（up 时把对方容器当 orphan/待 Recreate，可能覆盖对方基础设施）。
# 本机已有容器/卷均属于 ai-interview 项目（卷名 ai-interview_*），与此保持一致。

name: ai-interview

services:
  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_interview}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_interview}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${MYSQL_HOST_PORT:-33306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 首次初始化的临时 server 只开放 Unix Socket；必须等正式 TCP 3306 ready。
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: interview-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_HOST_PORT:-29200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: interview-redis
    ports:
      - "${REDIS_HOST_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: interview-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-29001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-interview}
    entrypoint: >
      /bin/sh -c "
      set -e
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY
      /usr/bin/mc mb --ignore-existing myminio/$$MINIO_BUCKET
      "

  # RabbitMQ 是唯一异步任务引擎；管理台 http://localhost:15672（guest/guest）。
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: interview-rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

# 宿主机端口（与 .env.example 一致）：
#   MySQL 33306 | Redis 26379 | ES 29200 | MinIO 29000/29001 | RabbitMQ 5672/15672

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:
  minio_data:
  rabbitmq_data:
