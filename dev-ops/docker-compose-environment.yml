name: ai-interview

services:
  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_interview_v2}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_interview}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${MYSQL_HOST_PORT:-33306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 首次初始化的临时 server 只开放 Unix Socket；必须等正式 TCP 3306 ready。
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: interview-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_HOST_PORT:-29200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: interview-redis
    ports:
      - "${REDIS_HOST_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: interview-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-29001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RabbitMQ 是唯一异步任务引擎；管理台 http://localhost:15672（guest/guest）。
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: interview-rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Neo4j 与其他本地依赖一起启动，不再使用 Compose profile。
  # 应用侧使用 NEO4J_URI=bolt://localhost:27687。
  neo4j:
    image: neo4j:5.26-community
    container_name: interview-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-neo4j-password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_BOLT_HOST_PORT:-27687}:7687"
      - "${NEO4J_HTTP_HOST_PORT:-27474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

# 宿主机端口（与 .env.example 一致）：
#   MySQL 33306 | Redis 26379 | ES 29200 | MinIO 29000/29001 | RabbitMQ 5672/15672

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  neo4j_data:
  neo4j_logs:
