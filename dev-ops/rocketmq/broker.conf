# RocketMQ broker 配置 —— 全栈场景（dev-ops/docker-compose-app.yml，app 与 broker 同处 compose 网络）
# 不覆盖 brokerIP1：broker 向 namesrv 注册容器网络 IP，app 容器按服务名可达。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 演示环境自动建 topic（生产应预建并关闭）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
