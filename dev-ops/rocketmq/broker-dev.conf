# RocketMQ broker 配置 —— 本地开发场景（dev-ops/docker-compose-environment.yml，依赖在 docker、app 在宿主机）
# brokerIP1=127.0.0.1：broker 向 namesrv 注册 127.0.0.1，宿主机 app 经「同端口发布」的 10911 可达。
# 因此 dev compose 必须把 broker 端口以 10911:10911 原样发布（advertised port 与发布端口须一致）。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
