# 生产部署 · 第一阶段（IP:端口 直连，无域名/无 HTTPS）
# 与 docker-compose-prod.yml 的唯一差异：去掉 Caddy，改为把 frontend 直接发布到宿主机端口。
# 访问：http://<服务器公网IP>:${WEB_HOST_PORT:-8080}
#
# 用法（服务器 dev-ops 目录）：
#   cp .env.prod.example .env   # 填好必填项（域名阶段同一个 .env 可复用）
#   docker compose --env-file .env -f docker-compose-ip.yml up -d --build
#
# ⚠️ 纯 HTTP + IP 访问的两个限制（迁到域名+HTTPS 后解除）：
#   1) 语音面试用不了：浏览器 getUserMedia 需要安全上下文(HTTPS)，http://IP 不算安全上下文。
#      文字问答/出题/简历/BYOK 均正常。
#   2) BYOK 填 Key 走明文传输：自己测试无妨，但别在此阶段让外人输入真实 Key（落库仍是 AES-GCM 加密，
#      仅浏览器→服务器这段是明文）。
#   3) 端口默认用 8080（非 80），规避大陆 80 端口对未备案域名的策略；纯 IP:8080 一般无需备案。
#
# 迁移到域名：备案通过后，改用 docker-compose-prod.yml（同一 .env、同一批 volume，数据不丢）：
#   docker compose --env-file .env -f docker-compose-ip.yml down
#   docker compose --env-file .env -f docker-compose-prod.yml up -d --build

name: ai-interview

services:
  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置强密码}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_interview}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置强密码}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    container_name: interview-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: interview-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms384m -Xmx384m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: interview-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 设置}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 设置强密码}
    volumes:
      - minio_data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET:-ai-interview}
      "

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: interview-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 设置强密码}
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: "0.6"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: interview-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8080
      JAVA_OPTS: "-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai -Xms192m -Xmx448m -XX:MaxDirectMemorySize=64m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?必填：≥32 字节强随机}
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY:?必填：BYOK 加密密钥，启用后勿改}
      APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ai_interview}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_HOST: http://elasticsearch:9200
      ES_INDEX_NAME: ai-interview-vector
      ES_DIMENSIONS: ${ES_DIMENSIONS:-1536}
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      APP_STORAGE_SECRET_KEY: ${MINIO_SECRET_KEY}
      APP_STORAGE_BUCKET: ${MINIO_BUCKET:-ai-interview}
      APP_STORAGE_REGION: us-east-1
      # FileStorageService 用的是 minio.* 配置（不是 app.storage.*），必须显式指向容器内 minio 服务，
      # 否则回退 localhost:9000 → 上传报"文件读取失败"(STORAGE 4001)。
      MINIO_URL: http://minio:9000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-interview}
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY:?必填：全局 embedding 用的 DashScope Key}
      AI_MODEL: ${AI_MODEL:-qwen3.5-flash}
      APP_ASYNC_ENGINE: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # CORS：必须包含浏览器实际访问的 origin，否则跨域校验返回 403（前端显示"请求失败"）
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://49.233.155.18:8080,https://interview.xiaoxiong123.cloud}
      # 4C4G 只保留面试主线：hybrid + RRF + 云端 rerank + small-to-big。
      APP_AI_RAG_RERANK_PROVIDER: cloud
      APP_AI_RAG_GRAPH_ENABLED: "false"
      APP_AI_RAG_GRAPH_AUTO_SYNC: "false"
      APP_AI_RAG_GRAPH_SKILL_BOOTSTRAP: "false"
      APP_AI_RAG_GRAPH_ENTITY_EXTRACTION_ENABLED: "false"
      APP_AI_RAG_SQL_ENABLED: "false"
      APP_AI_RAG_SQL_ROUTER_ENABLED: "false"
      APP_AI_RAG_CRAG_ENABLED: "false"
      APP_AI_AGENT_GITHUB_ENABLED: "false"
      APP_MCP_ENABLED: "false"
      SPRING_AI_MCP_SERVER_ENABLED: "false"
      # 不启 Neo4j：排除 langchain4j 社区 Neo4j 向量库自动配置（否则启动即连 localhost:7687 崩溃）；
      # 同时保留 Rabbit 自动配置排除（由 RabbitMqEngineConfig 在 rabbitmq 引擎时再条件装配）。
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,dev.langchain4j.community.neo4j.spring.Neo4jEmbeddingStoreAutoConfiguration,org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration,org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration,org.springframework.boot.autoconfigure.data.neo4j.Neo4jReactiveDataAutoConfiguration"
    mem_limit: 896m

  frontend:
    build: ../frontend
    container_name: interview-frontend
    restart: unless-stopped
    depends_on:
      - app
    # 第一阶段：直接把前端(含内建 /api /ws 反代)发布到宿主机端口，IP 直连访问
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    mem_limit: 96m

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:
  minio_data:
  rabbitmq_data:
