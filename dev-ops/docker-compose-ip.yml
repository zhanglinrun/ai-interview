# 临时引导模式（IP:端口，无 HTTPS；不作为 BYOK/MinerU 正式生产入口）
# 与 docker-compose-prod.yml 的唯一差异：去掉 Caddy，改为把 frontend 直接发布到宿主机端口。
# 访问：http://<服务器公网IP>:${WEB_HOST_PORT:-8080}
#
# 用法（服务器 dev-ops 目录）：
#   cp .env.prod.example .env   # 填好必填项（域名阶段同一个 .env 可复用）
#   docker compose --env-file .env -f docker-compose-ip.yml up -d --build
#
# ⚠️ 纯 HTTP + IP 访问的限制（迁到域名+HTTPS 后解除）：
#   1) BYOK 填 Key 走明文传输：自己测试无妨，但别在此阶段让外人输入真实 Key（落库仍是 AES-GCM 加密，
#      仅浏览器→服务器这段是明文）。
#   2) 端口默认用 8080（非 80），规避大陆 80 端口对未备案域名的策略；纯 IP:8080 一般无需备案。
#
# 迁移到域名：备案通过后，改用 docker-compose-prod.yml（同一 .env、同一批 volume，数据不丢）：
#   docker compose --env-file .env -f docker-compose-ip.yml down
#   docker compose --env-file .env -f docker-compose-prod.yml up -d --build

name: ai-interview

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置强密码}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_interview}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置强密码}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
    mem_limit: 384m
    cpus: 0.60
    logging: *container-logging
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --protocol=TCP -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7
    container_name: interview-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m
    cpus: 0.20
    logging: *container-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: interview-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms384m -Xmx384m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    mem_limit: 1024m
    cpus: 1.00
    logging: *container-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: interview-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 设置}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 设置强密码}
    volumes:
      - minio_data:/data
    mem_limit: 256m
    cpus: 0.35
    logging: *container-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  createbuckets:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET:-ai-interview}
      "
    mem_limit: 64m
    cpus: 0.10
    logging: *container-logging

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: interview-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ai_interview}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 设置强密码}
      # RabbitMQ 3.13 已拒绝旧的 RABBITMQ_VM_MEMORY_HIGH_WATERMARK 环境变量；
      # 低并发 4C6G 部署保留镜像默认的保守内存水位。
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 256m
    cpus: 0.35
    logging: *container-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: interview-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8080
      JAVA_OPTS: "-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai -Xms192m -Xmx448m -XX:MaxDirectMemorySize=64m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?必填：≥32 字节强随机}
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY:?必填：BYOK 加密密钥，启用后勿改}
      APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY: "true"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ai_interview}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_HOST: http://elasticsearch:9200
      ES_INDEX_NAME: ai-interview-vector
      ES_DIMENSIONS: ${ES_DIMENSIONS:-1536}
      # FileStorageService 使用 minio.* 配置，必须显式指向容器内 MinIO 服务，
      # 否则回退 localhost:9000 → 上传报"文件读取失败"(STORAGE 4001)。
      MINIO_URL: http://minio:9000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-interview}
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY:?必填：全局 embedding 用的 DashScope Key}
      AI_MODEL: ${AI_MODEL:-qwen3.5-flash}
      MINERU_ENABLED: ${MINERU_ENABLED:-true}
      MINERU_BASE_URL: ${MINERU_BASE_URL:-https://mineru.net}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ai_interview}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # CORS：必须包含浏览器实际访问的 origin，否则跨域校验返回 403。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?必填：填写浏览器实际访问的 origin}
      # 临时引导模式仍与 4C6G 生产基线保持相同 RAG 能力开关。
      APP_AI_RAG_RERANK_PROVIDER: cloud
      APP_AI_RAG_CRAG_ENABLED: "false"
      GITHUB_ENABLED: ${GITHUB_ENABLED:-true}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_PUBLIC_TOKEN: ${GITHUB_PUBLIC_TOKEN:-}
      GITHUB_SYNC_MAX_FILES: ${GITHUB_SYNC_MAX_FILES:-120}
      GITHUB_SYNC_MAX_BYTES: ${GITHUB_SYNC_MAX_BYTES:-10485760}
      GITHUB_MCP_ENABLED: ${GITHUB_MCP_ENABLED:-false}
      GITHUB_MCP_ENDPOINT: ${GITHUB_MCP_ENDPOINT:-https://api.githubcopilot.com/mcp/}
      GITHUB_MCP_ACCESS_TOKEN: ${GITHUB_MCP_ACCESS_TOKEN:-}
      GITHUB_MCP_MAX_RESPONSE_BYTES: ${GITHUB_MCP_MAX_RESPONSE_BYTES:-1048576}
      JUDGE0_ENABLED: ${JUDGE0_ENABLED:-false}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_API_HOST: ${JUDGE0_API_HOST:-}
      JUDGE0_CONNECT_TIMEOUT_MS: ${JUDGE0_CONNECT_TIMEOUT_MS:-5000}
      JUDGE0_REQUEST_TIMEOUT_MS: ${JUDGE0_REQUEST_TIMEOUT_MS:-10000}
      JUDGE0_JAVA_LANGUAGE_ID: ${JUDGE0_JAVA_LANGUAGE_ID:-}
      JUDGE0_PYTHON3_LANGUAGE_ID: ${JUDGE0_PYTHON3_LANGUAGE_ID:-}
      JUDGE0_POLL_INTERVAL_MS: ${JUDGE0_POLL_INTERVAL_MS:-1000}
      JUDGE0_TIMEOUT_SECONDS: ${JUDGE0_TIMEOUT_SECONDS:-30}
      JUDGE0_CPU_TIME_LIMIT_SECONDS: ${JUDGE0_CPU_TIME_LIMIT_SECONDS:-3}
      JUDGE0_MEMORY_LIMIT_KB: ${JUDGE0_MEMORY_LIMIT_KB:-262144}
      LOGGING_FILE_NAME: /app/logs/app.json
    volumes:
      - app_logs:/app/logs
    mem_limit: 896m
    cpus: 1.50
    logging: *container-logging
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ../frontend
    container_name: interview-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # 第一阶段：直接把前端（含内建 /api 反代）发布到宿主机端口，IP 直连访问
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    mem_limit: 96m
    cpus: 0.20
    logging: *container-logging
    healthcheck:
      # 自定义 nginx.conf 只声明 IPv4 listen；避免 Alpine wget 将 localhost 解析到 ::1。
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  app_logs:
