# Prometheus 采集配置
# 抓取后端 Spring Boot Actuator 暴露的 /actuator/prometheus 端点。
# 后端通过 docker-compose.monitor.yml 与本服务同网络，用服务名 app 直连；
# 本地直接 bootRun 时，把 target 改成 host.docker.internal:8080 即可。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ai-interview-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080
        labels:
          application: ai-interview-platform

  # 本地开发：后端跑在宿主机（mvn spring-boot:run），Prometheus 跑在容器里时启用这条，
  # 注释掉上面的 app:8080。Docker Desktop 下 host.docker.internal 指向宿主机。
  # - job_name: ai-interview-backend-local
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets:
  #         - host.docker.internal:8080
