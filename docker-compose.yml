services:
  # =========================================
  # 1. PostgreSQL 数据库服务
  # -----------------------------------------
  # 作用：
  #   - 存储业务数据（用户、简历、面试会话、知识库三表等）
  #
  # 教程知识点：
  #   - 业务数据存 PostgreSQL；向量检索走 Elasticsearch（见下方 elasticsearch 服务）。
  #   - schema 演进由 Flyway 管理。
  # =========================================
  postgres:
    image: postgres:16
    container_name: interview-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: interview_guide
    volumes:
      # 数据持久化：确保容器重启或删除后，数据库数据不丢失
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本：容器首次启动时会自动执行 /docker-entrypoint-initdb.d/ 下的 .sql 文件
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_HOST_PORT:-25432}:5432"
    # 健康检查：
    # 后端服务(app)需要等待数据库完全启动并准备好连接后才能启动。
    # 这里通过 pg_isready 命令检测数据库状态。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================
  # 2. Redis 缓存与消息队列服务
  # -----------------------------------------
  # 作用：
  #   - 缓存：存储 Session、临时数据，提升系统性能
  #   - 消息队列：利用 Redis Stream 实现简历分析、面试评估的异步任务处理
  #     （知识库向量化已迁移到 Spring 事件 + @Async，对齐 know-engine）
  #
  # 教程知识点：
  #   - 在轻量级架构中，Redis Stream 是 Kafka/RabbitMQ 的优秀替代方案，运维成本更低。
  # =========================================
  redis:
    image: redis:7
    container_name: interview-redis
    ports:
      - "${REDIS_HOST_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================
  # 3. Elasticsearch 向量存储服务
  # -----------------------------------------
  # 作用：
  #   - 知识库 RAG 检索的向量存储
  #   - LangChain4j ElasticsearchEmbeddingStore，1024 维 COSINE，KNN + 全文 + 混合检索
  #
  # 教程知识点：
  #   - 单节点 + 关闭安全认证，仅适用于本地开发/演示；生产环境应启用集群与 xpack 安全。
  #   - 后端通过 ES_HOST 环境变量连接，索引名 interview-guide-vector（见 .env.example）。
  # =========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: interview-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_HOST_PORT:-29200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================
  # 4. MinIO 对象存储服务
  # -----------------------------------------
  # 作用：
  #   - 存储非结构化数据：用户上传的简历(PDF/Word)、头像、知识库文档等
  #
  # 教程知识点：
  #   - MinIO 兼容 AWS S3 协议，这意味着代码中使用 S3 SDK 即可无缝切换到云厂商的对象存储。
  #   - 端口说明：
  #     - 9000: API 端口，代码通过此端口上传/下载文件
  #     - 9001: 控制台端口，浏览器访问此端口管理文件
  # =========================================
  minio:
    image: minio/minio
    container_name: interview-minio
    # 启动命令：指定数据目录和控制台地址
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_HOST_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-29001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================
  # 5. MinIO 初始化任务 (Init Container Pattern)
  # -----------------------------------------
  # 作用：
  #   - 自动创建项目所需的存储桶 (Bucket)
  #   - 设置存储桶的访问权限
  #
  # 教程知识点：
  #   - "初始化容器"模式：这是一个短生命周期的容器，任务完成后自动退出。
  #   - 解决了"谁来创建 Bucket"的问题，实现了基础设施的自动化配置，无需手动操作。
  # =========================================
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy # 必须等待 MinIO 服务健康（不仅仅是启动）
    entrypoint: |
      /bin/sh -c "
      # 1. 配置 MinIO 客户端别名 (myminio) 连接到 minio 服务
      set -e
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin
      # 2. 创建名为 interview-guide 的存储桶
      /usr/bin/mc mb --ignore-existing myminio/interview-guide
      # 3. 设置该存储桶为公共读权限（方便前端直接访问图片等资源）
      /usr/bin/mc anonymous set public myminio/interview-guide
      "

  # =========================================
  # 6. 后端应用服务 (Spring Boot)
  # -----------------------------------------
  # 作用：
  #   - 提供 RESTful API
  #   - 处理核心业务逻辑（简历分析、模拟面试、RAG）
  # =========================================
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interview-app
    # 依赖管理：确保基础设施准备好后再启动后端
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully # 等待初始化任务完成
    environment:
      # === 数据库连接 ===
      # 使用服务名 'postgres' 作为主机名，Docker 内部 DNS 会自动解析
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: interview_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      
      # === Redis 连接 ===
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # === Elasticsearch 向量存储 ===
      ES_HOST: http://elasticsearch:9200
      ES_INDEX_NAME: interview-guide-vector
      ES_DIMENSIONS: 1024

      # === 对象存储配置 ===
      # 注意：后端在容器内访问 MinIO，使用 http://minio:9000
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: minioadmin
      APP_STORAGE_SECRET_KEY: minioadmin
      APP_STORAGE_BUCKET: interview-guide
      APP_STORAGE_REGION: us-east-1
      
      # === AI 模型配置 (必须配置) ===
      # 这里的变量值来自宿主机的环境变量或 .env 文件
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen3.5-flash}

      # === 面试参数配置 ===
      APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
      APP_INTERVIEW_EVALUATION_BATCH_SIZE: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:-8}
    ports:
      - "${APP_HOST_PORT:-28082}:8080"

  # =========================================
  # 7. 前端应用服务 (Vue/React + Nginx)
  # -----------------------------------------
  # 作用：
  #   - 提供用户界面
  #   - 反向代理 API 请求（通常在 Nginx 配置中处理）
  # =========================================
  frontend:
    build: ./frontend
    container_name: interview-frontend
    depends_on:
      - app
    ports:
      - "${FRONTEND_HOST_PORT:-28080}:80"

# =========================================
# 定义 Docker 卷 (Volumes)
# -----------------------------------------
# 作用：声明命名卷，用于数据持久化。
# 即使删除了容器 (docker-compose down)，这些卷中的数据依然存在。
# =========================================
volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
  minio_data:
