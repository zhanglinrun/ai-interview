server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 与后端上传上限对齐（批量上传 max-request-size=300MB），避免 >50MB 直接 413 被误判为超时
    client_max_body_size 300M;
    # 默认 60s：国内传到海外机时大 PDF 会停住，nginx 直接掐连接，前端只能报「连接中断」
    client_body_timeout 600s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 上传必须先收完整 body 再转给 Tomcat。和 SSE 共用 /api/ 时
    # proxy_buffering off + 并行大 PDF 会让后端回空 400。
    location /api/v1/knowledge-bases/upload {
        client_max_body_size 300M;
        client_body_timeout 600s;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答（/api/knowledgebase/query/stream 等）必须关闭反代缓冲，
        # 否则 nginx 攒满 4k/8k 缓冲才吐，逐 token 打字机效果与 TTFT 全失效。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }

}
