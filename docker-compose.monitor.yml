# 监控编排：Prometheus 采集 + Grafana 看板
# 用法（与依赖服务一起起）：
#   docker compose -f docker-compose.dev.yml -f docker-compose.monitor.yml up -d
# 仅起监控：
#   docker compose -f docker-compose.monitor.yml up -d
#
# 起来后：
#   - Prometheus: http://localhost:9090  （Status -> Targets 可看后端是否被成功采集）
#   - Grafana:    http://localhost:3000  （默认 admin / admin，首登可跳过改密）
#     数据源和「AI Interview - RAG / 异步管道 / 稳定性」看板已自动加载，无需手动配置。
#
# 后端采集目标默认指向 compose 网络里的服务名 app:8080（完整部署 docker-compose.yml 场景）。
# 若后端是本机 mvn spring-boot:run 起的，按 docker/prometheus/prometheus.yml 注释切到
# host.docker.internal:8080。

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: interview-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    extra_hosts:
      # 让容器内的 host.docker.internal 在 Linux 上也能指向宿主机（本地采集场景需要）
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: interview-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  prometheus_data:
  grafana_data:
