name: CI

# 构建 + 测试 + 镜像三段式流水线。
# - backend：Maven 编译 + 单元/集成测试（H2 内存库；rag-eval 这类连真实 pgvector/DashScope 的评测默认排除）
# - frontend：pnpm 安装 + tsc 类型检查 + vite 构建
# - docker：仅验证后端镜像能构建成功（不推送），push 到主分支时才跑
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 同一分支的新提交取消旧的在跑流水线，省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest
    services:
      # 限流相关测试（RateLimitIntegrationTest / RateLimitScriptTest）需要真实 Redis
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        # rag-eval 组连真实 pgvector + DashScope，CI 里排除；其余单元/集成测试（H2）正常跑
        run: mvn -pl backend -am -B verify -Dtest.excludedGroups=rag-eval

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (type-check & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check & build
        working-directory: frontend
        run: pnpm build

  docker-build:
    name: Docker image (backend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # 只在推送到主分支时验证镜像构建，PR 阶段省时间
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ai-interview-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
