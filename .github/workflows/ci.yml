name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mvn -B -ntp -pl backend test

  frontend:
    name: Frontend typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pnpm dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm -C frontend install --frozen-lockfile
      - name: Typecheck, optional tests and production build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm -C frontend exec tsc --noEmit
          $package = Get-Content -LiteralPath 'frontend/package.json' -Raw -Encoding UTF8 |
            ConvertFrom-Json
          if ($null -ne $package.scripts.test) {
            pnpm -C frontend test -- --run
          }
          pnpm -C frontend build

  release-contracts:
    name: Release content, schema and Compose contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate capability and Hot 100 content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./dev-ops/ci/Test-ReleaseContent.ps1
      - name: Validate every Compose topology
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./dev-ops/ci/Test-ComposeConfig.ps1
      - name: Validate fresh MySQL schema
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./dev-ops/ci/Test-FreshSchema.ps1
      - name: Validate release scripts and deployment assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./dev-ops/ci/Test-PowerShellSyntax.ps1
          ./dev-ops/ci/Test-DeploymentAssets.ps1

  security:
    name: Secret and dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  images:
    name: Container image build gate
    needs: [backend, frontend, release-contracts, security]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ai-interview-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: ai-interview-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
