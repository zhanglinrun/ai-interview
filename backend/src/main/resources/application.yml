# AI Interview Platform Configuration
# 智能AI面试官平台配置

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: ${SERVER_PORT:8082}
  # 明确指定HTTP响应编码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    # Tomcat 11 默认单个 multipart 请求最多 10 个文件部分，批量上传需放宽；-1 表示不限制
    max-part-count: ${APP_TOMCAT_MAX_PART_COUNT:256}

# Actuator / Micrometer 监控端点
# 暴露 prometheus 端点供采集 RAG 检索、Agent 决策、结构化输出等指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ai-interview-platform
    distribution:
      # 为延迟类 Timer 导出直方图桶（_bucket 序列），Grafana 看板的
      # histogram_quantile(P99/P95/P50) 依赖它；只开 http 和 app.ai 前缀，控制时间序列基数。
      percentiles-histogram:
        "[http.server.requests]": true
        "[app.ai]": true

# SpringDoc OpenAPI / Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.linrun.interview

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: ai-interview-platform

  # 启用虚拟线程 (Java 21+)
  threads:
    virtual:
      enabled: true

  # MySQL + Druid（对齐业界实践）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:ai_interview_v2}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:ai_interview}
    password: ${MYSQL_PASSWORD:ai_interview}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      stat-view-servlet:
        # 默认关闭 Druid 监控台，避免公网暴露内部 SQL 监控接口。
        # 需要时用环境变量显式开启，并务必设置强口令，不再使用 admin/admin。
        enabled: ${DRUID_STAT_VIEW_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_ADMIN_USER:admin}
        login-password: ${DRUID_ADMIN_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # RabbitMQ（唯一异步任务引擎）。
  # 本机默认 localhost:5672，容器编排用 RABBITMQ_HOST=rabbitmq 覆盖。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:100MB}  # 支持知识库上传大 PDF（简历限制在业务层检查）
      # 批量上传一次携带多个文档，请求体上限放宽到容纳整批；单文件仍受 max-file-size 约束
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:300MB}
  

  # Redisson配置 (使用 spring.redis.redisson，参考官方文档)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: 0
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
  
  # LangChain4j 配置（chat + embedding 由 app.ai.providers 驱动 LlmProviderRegistry 手动构造）

# Sa-Token：统一会话和 Redis 持久化。开发环境可使用本地 Redis，生产环境必须配置独立实例。
sa-token:
  token-name: ${SA_TOKEN_NAME:satoken}
  timeout: ${SA_TOKEN_TIMEOUT:2592000}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:86400}
  is-concurrent: true
  is-share: false
  is-log: ${SA_TOKEN_LOG:false}
  token-style: uuid
  is-read-header: true
  is-read-cookie: ${SA_TOKEN_READ_COOKIE:false}
  is-read-body: false
  alone-auth: false

# MyBatis-Plus 配置（对齐业界实践）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Elasticsearch 向量存储（对齐业界实践：text-embedding-v4 / 1536 维）
elasticsearch:
  host: ${ES_HOST:http://localhost:9200}
  index-name: ${ES_INDEX_NAME:ai-interview-vector}
  dimensions: ${ES_DIMENSIONS:1536}
  num-candidates: ${ES_NUM_CANDIDATES:100}

# MinIO 对象存储（对齐业界实践）
minio:
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ${MINIO_BUCKET:ai-interview}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  publicRead: ${MINIO_PUBLIC_READ:true}
  # MinerU 云服务必须能访问此地址；生产使用 https://files.<domain>，桶公共读供 VL 拉取图片。
  externalEndpoint: ${MINIO_EXTERNAL_ENDPOINT:}

file:
  parse:
    mineru:
      enabled: ${MINERU_ENABLED:true}
      base-url: ${MINERU_BASE_URL:https://mineru.net}
      api-token: ${MINERU_API_TOKEN:}
      submit-path: ${MINERU_SUBMIT_PATH:/api/v4/extract/task}
      status-path: ${MINERU_STATUS_PATH:/api/v4/extract/task/{taskId}}
      model-version: ${MINERU_MODEL_VERSION:vlm}
      html-model-version: ${MINERU_HTML_MODEL_VERSION:MinerU-HTML}
      connect-timeout-ms: ${MINERU_CONNECT_TIMEOUT_MS:10000}
      request-timeout-ms: ${MINERU_REQUEST_TIMEOUT_MS:30000}
      poll-interval-ms: ${MINERU_POLL_INTERVAL_MS:2000}
      task-timeout-seconds: ${MINERU_TASK_TIMEOUT_SECONDS:300}
      presigned-url-ttl-seconds: ${MINERU_PRESIGNED_URL_TTL_SECONDS:600}
      max-zip-bytes: ${MINERU_MAX_ZIP_BYTES:104857600}
      max-json-response-bytes: ${MINERU_MAX_JSON_RESPONSE_BYTES:1048576}
      max-uncompressed-bytes: ${MINERU_MAX_UNCOMPRESSED_BYTES:209715200}
      max-zip-entries: ${MINERU_MAX_ZIP_ENTRIES:10000}
      max-compression-ratio: ${MINERU_MAX_COMPRESSION_RATIO:100}
      max-markdown-bytes: ${MINERU_MAX_MARKDOWN_BYTES:20971520}
      max-image-bytes: ${MINERU_MAX_IMAGE_BYTES:20971520}
      max-images: ${MINERU_MAX_IMAGES:200}
      allow-private-result-urls: ${MINERU_ALLOW_PRIVATE_RESULT_URLS:false}
      allow-private-source-urls: ${MINERU_ALLOW_PRIVATE_SOURCE_URLS:false}
      compensation-enabled: ${MINERU_COMPENSATION_ENABLED:true}
      compensation-stale-seconds: ${MINERU_COMPENSATION_STALE_SECONDS:30}
      vision-alt-enabled: ${MINERU_VISION_ALT_ENABLED:true}
      vision-model: ${MINERU_VISION_MODEL:qwen3-vl-plus}

# Application custom configuration
app:
  dingtalk:
    enabled: ${APP_DINGTALK_ENABLED:false}
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    verification-token: ${DINGTALK_VERIFICATION_TOKEN:${APP_AI_RAG_DINGTALK_TOKEN:}}
    aes-key: ${DINGTALK_AES_KEY:}
    robot-webhook: ${DINGTALK_ROBOT_WEBHOOK:}
    robot-secret: ${DINGTALK_ROBOT_SECRET:}
    replay-window-seconds: ${DINGTALK_REPLAY_WINDOW_SECONDS:300}
    max-question-chars: ${DINGTALK_MAX_QUESTION_CHARS:2000}
    fallback-user-id: ${DINGTALK_FALLBACK_USER_ID:1}
    default-knowledge-base-ids: ${DINGTALK_DEFAULT_KNOWLEDGE_BASE_IDS:}
  rag-evaluation:
    intent-accuracy: ${RAG_EVAL_INTENT_ACCURACY:0.90}
    intent-macro-f1: ${RAG_EVAL_INTENT_MACRO_F1:0.85}
    retrieval-recall: ${RAG_EVAL_RETRIEVAL_RECALL:0.85}
    retrieval-mrr: ${RAG_EVAL_RETRIEVAL_MRR:0.75}
    retrieval-ndcg: ${RAG_EVAL_RETRIEVAL_NDCG:0.75}
    citation-coverage: ${RAG_EVAL_CITATION_COVERAGE:0.90}
    groundedness: ${RAG_EVAL_GROUNDEDNESS:0.80}
    answer-quality: ${RAG_EVAL_ANSWER_QUALITY:0.75}
    regression-threshold: ${RAG_EVAL_REGRESSION_THRESHOLD:0.05}
  job:
    xxl:
      enabled: ${APP_JOB_XXL_ENABLED:false}
      admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
      app-name: ${XXL_JOB_APP_NAME:ai-interview-backend}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:0}
      access-token: ${XXL_JOB_ACCESS_TOKEN:}
      log-path: ${XXL_JOB_LOG_PATH:}
      log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}
  knowledgebase:
    vectorization:
      max-attempts: ${APP_KB_VECTOR_MAX_ATTEMPTS:5}
      claim-lease: ${APP_KB_VECTOR_CLAIM_LEASE:30m}
      base-backoff: ${APP_KB_VECTOR_BASE_BACKOFF:1m}
      max-backoff: ${APP_KB_VECTOR_MAX_BACKOFF:1h}
      recovery-batch-size: ${APP_KB_VECTOR_RECOVERY_BATCH_SIZE:50}
    compensation:
      neo4j-delay-ms: ${APP_KB_NEO4J_COMPENSATION_DELAY_MS:900000}
      neo4j-initial-delay-ms: ${APP_KB_NEO4J_COMPENSATION_INITIAL_DELAY_MS:20000}
  job-interview:
    prompt-version: ${JOB_INTERVIEW_PROMPT_VERSION:job-interview-v2}
    follow-up-limit-per-main-question: ${JOB_INTERVIEW_FOLLOW_UP_LIMIT:1}
    reflection-limit-per-session: ${JOB_INTERVIEW_REFLECTION_LIMIT:1}
    natural-close-minutes: ${JOB_INTERVIEW_NATURAL_CLOSE_MINUTES:5}
    reconnect-event-limit: ${JOB_INTERVIEW_RECONNECT_EVENT_LIMIT:100}
    # 覆盖模型评价与 Judge0 的正常耗时；进程宕机后由请求/分钟级补偿回收执行槽。
    command-lease-seconds: ${JOB_INTERVIEW_COMMAND_LEASE_SECONDS:300}
    idle-pause-minutes: ${JOB_INTERVIEW_IDLE_PAUSE_MINUTES:30}
    resume-hours: ${JOB_INTERVIEW_RESUME_HOURS:24}
  capability-content:
    # fresh schema 启动时幂等导入仓库内版本化能力目录；测试环境关闭。
    auto-import: ${APP_CAPABILITY_CONTENT_AUTO_IMPORT:true}
  algorithm-content:
    # 完整 Hot 100 映射与 20 道平台自述首发题，按 contentVersion 幂等导入。
    auto-import: ${APP_ALGORITHM_CONTENT_AUTO_IMPORT:true}
  algorithm:
    # 只连接外部 Judge0，本应用不会在 4C6G 服务器执行用户源码。
    judge0:
      enabled: ${JUDGE0_ENABLED:false}
      base-url: ${JUDGE0_BASE_URL:}
      api-key: ${JUDGE0_API_KEY:}
      api-host: ${JUDGE0_API_HOST:}
      api-key-header: ${JUDGE0_API_KEY_HEADER:X-RapidAPI-Key}
      # 内部协议值保留 JAVA21 以兼容既有题库和作答数据；运行时版本由 Judge 服务决定。
      java21-language-id: ${JUDGE0_JAVA_LANGUAGE_ID:${JUDGE0_JAVA21_LANGUAGE_ID:}}
      python3-language-id: ${JUDGE0_PYTHON3_LANGUAGE_ID:}
      connect-timeout-ms: ${JUDGE0_CONNECT_TIMEOUT_MS:5000}
      request-timeout-ms: ${JUDGE0_REQUEST_TIMEOUT_MS:10000}
      poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:1000}
      timeout-seconds: ${JUDGE0_TIMEOUT_SECONDS:30}
      cpu-time-limit-seconds: ${JUDGE0_CPU_TIME_LIMIT_SECONDS:3}
      memory-limit-kb: ${JUDGE0_MEMORY_LIMIT_KB:262144}
  # GitHub 公共仓库固定 SHA 代码证据。Token 可空，仅提高公共只读 API 限额。
  github:
    enabled: ${GITHUB_ENABLED:true}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    public-token: ${GITHUB_PUBLIC_TOKEN:}
    timeout-seconds: ${GITHUB_TIMEOUT_SECONDS:10}
    max-files: ${GITHUB_SYNC_MAX_FILES:120}
    max-bytes: ${GITHUB_SYNC_MAX_BYTES:10485760}
    max-file-bytes: ${GITHUB_SYNC_MAX_FILE_BYTES:262144}
    max-tree-entries: ${GITHUB_SYNC_MAX_TREE_ENTRIES:10000}
    request-budget: ${GITHUB_SYNC_REQUEST_BUDGET:150}
    max-api-response-bytes: ${GITHUB_MAX_API_RESPONSE_BYTES:16777216}
    chunk-max-lines: ${GITHUB_CHUNK_MAX_LINES:120}
    chunk-overlap-lines: ${GITHUB_CHUNK_OVERLAP_LINES:20}
    chunk-max-chars: ${GITHUB_CHUNK_MAX_CHARS:12000}
    max-chunks-per-file: ${GITHUB_MAX_CHUNKS_PER_FILE:80}
    max-evidence-chunks: ${GITHUB_MAX_EVIDENCE_CHUNKS:2000}
    mcp-enabled: ${GITHUB_MCP_ENABLED:false}
    mcp-endpoint: ${GITHUB_MCP_ENDPOINT:https://api.githubcopilot.com/mcp/}
    mcp-access-token: ${GITHUB_MCP_ACCESS_TOKEN:}
    max-mcp-response-bytes: ${GITHUB_MCP_MAX_RESPONSE_BYTES:1048576}

  ai:
    default-provider: dashscope
    default-embedding-provider: dashscope
    embedding-dimensions: ${APP_AI_EMBEDDING_DIMENSIONS:1536}
    security:
      api-key-encryption-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:}
      require-encryption-key: ${APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY:false}
    # LLM 思考模式开关。qwen3.5-flash 等 reasoning 模型默认开启 thinking，会对查询改写等
    # 简单任务产生上千 token 思考过程（单次调用 16-40 秒）。默认关闭以降低延迟，需要深度
    # 推理时设 APP_AI_THINKING_ENABLED=true 开启（非 reasoning 模型会忽略 enable_thinking）。
    thinking:
      enabled: ${APP_AI_THINKING_ENABLED:false}
    # 运行时可写的 Provider 配置落点（与 classpath 主 application.yml 隔离）。
    # 开发环境默认写到用户主目录下，避免污染源码目录或 jar 内 classpath 资源。
    config-yaml-path: ${APP_AI_CONFIG_YAML_PATH:${user.home}/.ai-interview/llm-providers.yml}
    config-env-path: ${APP_AI_CONFIG_ENV_PATH:${user.home}/.ai-interview/llm-providers.env}
    # 中心化面试编排（Planner 出大纲 → Interviewer 出题 → Critic 审题 → Reflection 反思环）
    # + 两层记忆（会话内 ChatMemory 窗口 + 跨会话候选人画像）。关闭 enabled 回退批量出题。
    agent:
      enabled: ${APP_AI_AGENT_ENABLED:true}
      # Critic 审题开关：关闭=Interviewer 直出（A/B 对比「直出 vs Reflexion」用）
      critic-enabled: ${APP_AI_AGENT_CRITIC_ENABLED:true}
      tools:
        enabled: ${APP_AI_AGENT_TOOLS_ENABLED:true}
      # Reflexion 反思重生成上限（Critic 连续打回的最大重出次数）
      max-reflexion: ${APP_AI_AGENT_MAX_REFLEXION:2}
      # 会话内 ChatMemory 窗口大小（消息条数，Redis 持久化）
      memory-window: ${APP_AI_AGENT_MEMORY_WINDOW:20}
      # 编排指标上报（agent.critic.verdicts / reflexion.rounds / question.latency）
      metrics-enabled: ${APP_AI_AGENT_METRICS_ENABLED:true}
      # 跨会话能力画像：逐题评估结果确定性沉淀为能力观测，Planner 下次面试注入
      candidate-memory:
        enabled: ${APP_AI_AGENT_CANDIDATE_MEMORY_ENABLED:true}
        max-entries: ${APP_AI_AGENT_CANDIDATE_MEMORY_MAX_ENTRIES:8}
    trace:
      enabled: ${APP_AI_TRACE_ENABLED:true}
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY}
        model: ${AI_MODEL:qwen3.5-flash}
        embedding-model: text-embedding-v4
        embedding-dimensions: 1536
        supports-embedding: true
      lmstudio:
        base-url: http://localhost:1234
        api-key: ${PROVIDER_LMSTUDIO_API_KEY:lm-studio}
        model: qwen2.5-7b-instruct
        supports-embedding: false
      # ===== 预设 Provider（填完 API Key 后即可使用）=====
      # Moonshot AI / Kimi（OpenAI 兼容） https://platform.moonshot.cn/
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY:}
        model: ${PROVIDER_KIMI_MODEL:kimi-latest}
        temperature: 1
        supports-embedding: false
      # DeepSeek（OpenAI 兼容） https://api-docs.deepseek.com/
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${PROVIDER_DEEPSEEK_API_KEY:}
        model: ${PROVIDER_DEEPSEEK_MODEL:deepseek-v4-flash}
        supports-embedding: false
      # 智谱 AI / GLM（OpenAI 兼容） https://open.bigmodel.cn/
      glm:
        base-url: https://open.bigmodel.cn/api/coding/paas/v4
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_MODEL:glm-5}
        embedding-model: embedding-3
        embedding-dimensions: 1024
        supports-embedding: true
    advisors:
      enabled: ${APP_AI_ADVISORS_ENABLED:true}
      tool-call-enabled: ${APP_AI_ADVISORS_TOOL_CALL_ENABLED:true}
      tool-call-conversation-history-enabled: ${APP_AI_ADVISORS_TOOL_CALL_CONVERSATION_HISTORY_ENABLED:false}
      stream-tool-call-responses: ${APP_AI_ADVISORS_STREAM_TOOL_CALL_RESPONSES:false}
      message-chat-memory-enabled: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_ENABLED:false}
      message-chat-memory-max-messages: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_MAX_MESSAGES:120}
      simple-logger-enabled: ${APP_AI_ADVISORS_SIMPLE_LOGGER_ENABLED:false}
    # 结构化输出重试次数（JSON 解析失败时的业务层重试）
    structured-max-attempts: ${APP_AI_STRUCTURED_MAX_ATTEMPTS:2}
    # 重试时是否将上次错误原因注入提示词，帮助模型定向修复输出
    structured-include-last-error: ${APP_AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
    # 是否启用“修复型重试提示词”（关闭后每次重试沿用原始 system prompt）
    structured-retry-use-repair-prompt: ${APP_AI_STRUCTURED_RETRY_USE_REPAIR_PROMPT:true}
    # 修复型重试提示词中是否追加严格 JSON 指令
    structured-retry-append-strict-json-instruction: ${APP_AI_STRUCTURED_RETRY_APPEND_STRICT_JSON_INSTRUCTION:true}
    # 注入到重试提示词中的错误信息最大长度
    structured-error-message-max-length: ${APP_AI_STRUCTURED_ERROR_MESSAGE_MAX_LENGTH:200}
    # 是否开启结构化输出调用指标（invocations/attempts/latency）
    structured-metrics-enabled: ${APP_AI_STRUCTURED_METRICS_ENABLED:true}
    rag:
      rewrite:
        enabled: ${APP_AI_RAG_REWRITE_ENABLED:true}
        model: ${APP_AI_RAG_REWRITE_MODEL:}
      search:
        short-query-length: ${APP_AI_RAG_SHORT_QUERY_LENGTH:4}
        topk-short: ${APP_AI_RAG_TOPK_SHORT:20}
        topk-medium: ${APP_AI_RAG_TOPK_MEDIUM:12}
        topk-long: ${APP_AI_RAG_TOPK_LONG:8}
        min-score-short: ${APP_AI_RAG_MIN_SCORE_SHORT:0.18}
        min-score-default: ${APP_AI_RAG_MIN_SCORE_DEFAULT:0.28}
      # 混合检索（对齐业界实践 默认 hybrid：ES 向量 + BM25/RRF）
      hybrid:
        enabled: ${APP_AI_RAG_HYBRID_ENABLED:true}
        dual-channel: ${APP_AI_RAG_HYBRID_DUAL_CHANNEL:true}
        mode: ${APP_AI_RAG_HYBRID_MODE:hybrid}
        keyword-top-k: ${APP_AI_RAG_HYBRID_KEYWORD_TOPK:20}
        keyword-min-similarity: ${APP_AI_RAG_HYBRID_KEYWORD_MIN_SIM:0.1}
        rrf-k: ${APP_AI_RAG_HYBRID_RRF_K:60}
        fusion-top-k: ${APP_AI_RAG_HYBRID_FUSION_TOPK:12}
      # 重排：默认本地 ONNX BGE-RERANKER（对齐业界实践）
      rerank:
        enabled: ${APP_AI_RAG_RERANK_ENABLED:true}
        provider: ${APP_AI_RAG_RERANK_PROVIDER:local}
        model: ${APP_AI_RAG_RERANK_MODEL:gte-rerank-v2}
        top-n: ${APP_AI_RAG_RERANK_TOPN:6}
        timeout-ms: ${APP_AI_RAG_RERANK_TIMEOUT_MS:3000}
        # 本地 ONNX reranker 模型文件配置（provider=local 时生效）
        # 模型文件不入 git，需手动下载放到 backend/src/main/resources/model/bge-reranker-model/
        # 详见 backend/src/main/resources/model/bge-reranker-model/README.md
        local:
          model-path: ${APP_AI_RAG_RERANK_LOCAL_MODEL_PATH:classpath:model/bge-reranker-model/model_quantized.onnx}
          tokenizer-path: ${APP_AI_RAG_RERANK_LOCAL_TOKENIZER_PATH:classpath:model/bge-reranker-model/tokenizer.json}
          max-sequence-length: ${APP_AI_RAG_RERANK_LOCAL_MAX_SEQ_LEN:8192}
      # 父子/兄弟分段扩展（small-to-big）：子块完成 RRF/rerank/TopN 后，按 parentChunkId
      # 取父块章节，或按 brotherChunkId 取同组兄弟按序拼接，再交给 LLM。
      # 开启后每次检索会多一次 segment 表批量查询（按 chunkId / brotherChunkId 命中索引）。
      parent-expand:
        enabled: ${APP_AI_RAG_PARENT_EXPAND_ENABLED:true}
        # 扩展策略：replace = 命中子块后用父块全文替换（small-to-big）
        strategy: ${APP_AI_RAG_PARENT_EXPAND_STRATEGY:replace}
        # replace 时以父块为主；适当放宽避免过早截断整章上下文
        max-chars: ${APP_AI_RAG_PARENT_EXPAND_MAX_CHARS:8000}
        max-siblings: ${APP_AI_RAG_PARENT_EXPAND_MAX_SIBLINGS:5}
        cache-ttl-seconds: ${APP_AI_RAG_PARENT_EXPAND_CACHE_TTL:30}
      # 最终上下文总预算：按 RRF/rerank 顺序保留完整片段，保证 [n] 与 sources 索引一致。
      context:
        max-total-chars: ${APP_AI_RAG_CONTEXT_MAX_TOTAL_CHARS:6000}
      # 多 Query（原问题/rewrite/HyDE/分解子查询）之间的 RRF 参数。
      fusion:
        rrf-k: ${APP_AI_RAG_FUSION_RRF_K:60}
        final-top-k: ${APP_AI_RAG_FUSION_FINAL_TOP_K:12}
      # Query Decomposition（P2）：复杂问题拆子查询并行检索，简单问题规则预筛跳过
      decompose:
        enabled: ${APP_AI_RAG_DECOMPOSE_ENABLED:true}
        max-sub-queries: ${APP_AI_RAG_DECOMPOSE_MAX_SUB_QUERIES:4}
        model: ${APP_AI_RAG_DECOMPOSE_MODEL:}
      # CRAG 纠正式检索（P2）：rerank 后小模型打分 correct/ambiguous/incorrect，
      # ambiguous 重写重检索一次，incorrect 走通用对话兜底（默认关闭，评测/演示按需开启）
      crag:
        enabled: ${APP_AI_RAG_CRAG_ENABLED:false}
        grade-top-n: ${APP_AI_RAG_CRAG_GRADE_TOPN:3}
        snippet-max-chars: ${APP_AI_RAG_CRAG_SNIPPET_MAX_CHARS:400}
        model: ${APP_AI_RAG_CRAG_MODEL:}
      # 自适应检索路由（P2）：意图识别 needRetrieval=false 时跳过检索直接生成
      adaptive:
        enabled: ${APP_AI_RAG_ADAPTIVE_ENABLED:true}
      # 三源智能路由：ES 非结构化知识 + MySQL Text2SQL + Neo4j Text2Cypher。
      # SQL/Neo4j 均有安全白名单与 ES 降级；本地 Compose 默认提供 Neo4j。
      multi-source:
        enabled: ${APP_AI_RAG_MULTI_SOURCE_ENABLED:true}
        llm-route-enabled: ${APP_AI_RAG_LLM_ROUTE_ENABLED:true}
        route-model: ${APP_AI_RAG_ROUTE_MODEL:}
        sql:
          enabled: ${APP_AI_RAG_SQL_ENABLED:true}
          allowed-tables: ${APP_AI_RAG_SQL_ALLOWED_TABLES:documents,resumes,interview_sessions,chat_sessions,chat_messages,chat_memories}
          schema-cache-seconds: ${APP_AI_RAG_SQL_SCHEMA_CACHE_SECONDS:300}
          max-rows: ${APP_AI_RAG_SQL_MAX_ROWS:100}
          prompt-path: ${APP_AI_RAG_SQL_PROMPT_PATH:classpath:prompts/rag/text-to-sql.txt}
        neo4j:
          enabled: ${APP_AI_RAG_NEO4J_ENABLED:true}
          uri: ${NEO4J_URI:bolt://localhost:27687}
          username: ${NEO4J_USERNAME:neo4j}
          password: ${NEO4J_PASSWORD:change-me-neo4j-password}
          database: ${NEO4J_DATABASE:neo4j}
          schema: ${NEO4J_SCHEMA:节点：KnowledgeEntity(entityId,name,normalizedName,entityType,aliases,description,scope,ownerUserId,projectionSource)；关系：(source:KnowledgeEntity)-[:RELATES_TO](target:KnowledgeEntity)，关系属性：relationId、relationType、description、confidence。关系类型放在 relationType 属性中，例如 USES、BUILDS_ON、DEPENDS_ON、INTEGRATES_WITH、PART_OF、RETRIEVES_FROM、RERANKS、PERSISTS、ROUTES_TO；图谱用于 Agent、LangChain、LangGraph、RAG 和基础设施等业务实体关系，不存放文档分段父子关系。查询必须只读。}
          seed-enabled: ${APP_AI_RAG_NEO4J_SEED_ENABLED:true}
          seed-path: ${APP_AI_RAG_NEO4J_SEED_PATH:classpath:neo4j/ai-interview-domain.json}
          platform-owner-id: ${APP_AI_RAG_NEO4J_PLATFORM_OWNER_ID:0}
          knowledge-base-scope-required: ${APP_AI_RAG_NEO4J_KB_SCOPE_REQUIRED:false}
          user-scope-required: ${APP_AI_RAG_NEO4J_USER_SCOPE_REQUIRED:true}
          user-scope-property: ${APP_AI_RAG_NEO4J_USER_SCOPE_PROPERTY:ownerUserId}
          max-rows: ${APP_AI_RAG_NEO4J_MAX_ROWS:100}
          max-retries: ${APP_AI_RAG_NEO4J_MAX_RETRIES:1}
          prompt-path: ${APP_AI_RAG_NEO4J_PROMPT_PATH:classpath:prompts/rag/text-to-cypher.txt}
        dingtalk:
          enabled: ${APP_AI_RAG_DINGTALK_ENABLED:false}
          token: ${APP_AI_RAG_DINGTALK_TOKEN:}
          max-question-chars: ${APP_AI_RAG_DINGTALK_MAX_QUESTION_CHARS:2000}
      # RAG 流式生成专用模型（对齐业界实践 qwen3.6-plus）
      generation:
        streaming-model: ${APP_AI_RAG_GENERATION_MODEL:qwen3.6-plus}
        temperature: 0.2
      # 意图识别兜底
      intent-recognition:
        enabled: ${APP_AI_RAG_INTENT_RECOGNITION_ENABLED:true}
        # 是否在意图识别前推"正在理解您的问题..."进度（关闭可省前端空进度）
        progress-enabled: ${APP_AI_RAG_INTENT_RECOGNITION_PROGRESS_ENABLED:true}
        model: ${APP_AI_RAG_INTENT_MODEL:}
        llm-weight: ${APP_AI_RAG_INTENT_LLM_WEIGHT:0.6}
        vector-weight: ${APP_AI_RAG_INTENT_VECTOR_WEIGHT:0.25}
        rule-weight: ${APP_AI_RAG_INTENT_RULE_WEIGHT:0.15}
        min-confidence: ${APP_AI_RAG_INTENT_MIN_CONFIDENCE:0.3}
        cache-max-size: ${APP_AI_RAG_INTENT_CACHE_MAX_SIZE:1000}
        max-history-messages: ${APP_AI_RAG_INTENT_MAX_HISTORY_MESSAGES:6}
        history-message-max-chars: ${APP_AI_RAG_INTENT_HISTORY_MESSAGE_MAX_CHARS:160}
      title-summary:
        enabled: ${APP_AI_RAG_TITLE_SUMMARY_ENABLED:true}
        model: ${APP_AI_RAG_TITLE_MODEL:qwen3.5-flash}
  interview:
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    evaluation:
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}
  resume:
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  # CORS配置 - React前端
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:80,http://localhost:28080,http://127.0.0.1:28080}
