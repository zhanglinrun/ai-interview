# AI Interview Platform Configuration
# 智能AI面试官平台配置

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: ${SERVER_PORT:8082}
  # 明确指定HTTP响应编码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    # Tomcat 11 默认单个 multipart 请求最多 10 个文件部分，批量上传需放宽；-1 表示不限制
    max-part-count: ${APP_TOMCAT_MAX_PART_COUNT:256}

# Actuator / Micrometer 监控端点
# 暴露 prometheus 端点供采集 RAG 检索、Agent 决策、结构化输出等指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ai-interview-platform
    distribution:
      # 为延迟类 Timer 导出直方图桶（_bucket 序列），Grafana 看板的
      # histogram_quantile(P99/P95/P50) 依赖它；只开 http 和 app.ai 前缀，控制时间序列基数。
      percentiles-histogram:
        "[http.server.requests]": true
        "[app.ai]": true

# SpringDoc OpenAPI / Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.linrun.interview.modules

spring:
  config:
    import:
      - optional:classpath:voice-interview-opening.yml
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: ai-interview-platform

  # 启用虚拟线程 (Java 21+)
  threads:
    virtual:
      enabled: true

  # MySQL + Druid（对齐 know-engine）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:interview_guide}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:interview_guide}
    password: ${MYSQL_PASSWORD:interview_guide}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB  # 支持知识库上传（简历限制在业务层检查）
      # 批量上传一次携带多个文档，请求体上限放宽到容纳整批；单文件仍受 max-file-size 约束
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:300MB}
  

  # Redisson配置 (使用 spring.redis.redisson，参考官方文档)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: 0
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
  
  # LangChain4j 配置（chat + embedding 由 app.ai.providers 驱动 LlmProviderRegistry 手动构造）

# MyBatis-Plus 配置（对齐 know-engine）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Elasticsearch 向量存储（对齐 know-engine：text-embedding-v4 / 1536 维）
elasticsearch:
  host: ${ES_HOST:http://localhost:9200}
  index-name: ${ES_INDEX_NAME:interview-guide-vector}
  dimensions: ${ES_DIMENSIONS:1536}
  num-candidates: ${ES_NUM_CANDIDATES:100}

# MinIO 对象存储（对齐 know-engine）
minio:
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ${MINIO_BUCKET:interview-guide}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}

# Neo4j 图数据库（Text2Cypher）
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USER:neo4j}
  password: ${NEO4J_PASSWORD:neo4j666}

langchain4j:
  community:
    neo4j:
      await-index-timeout: 300
      auth:
        uri: ${NEO4J_URI:bolt://localhost:7687}
        user: ${NEO4J_USER:neo4j}
        password: ${NEO4J_PASSWORD:neo4j666}

# XXL-Job 配置（对齐 know-engine 2.4）
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8080/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: ${XXL_JOB_EXECUTOR:ai-interview-executor}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}

# Application custom configuration
app:
  security:
    jwt:
      # JWT 密钥（至少 32 字节，生产环境必须改为强随机密钥）
      secret: ${APP_JWT_SECRET:change-this-to-a-strong-random-secret-at-least-32-bytes-long}
      access-token-validity-ms: 3600000      # 1 小时
      refresh-token-validity-ms: 2592000000  # 30 天

  ai:
    default-provider: dashscope
    default-embedding-provider: dashscope
    embedding-dimensions: ${APP_AI_EMBEDDING_DIMENSIONS:1536}
    security:
      api-key-encryption-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:}
      require-encryption-key: ${APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY:false}
    # LLM 思考模式开关。qwen3.5-flash 等 reasoning 模型默认开启 thinking，会对查询改写等
    # 简单任务产生上千 token 思考过程（单次调用 16-40 秒）。默认关闭以降低延迟，需要深度
    # 推理时设 APP_AI_THINKING_ENABLED=true 开启（非 reasoning 模型会忽略 enable_thinking）。
    thinking:
      enabled: ${APP_AI_THINKING_ENABLED:false}
    # 运行时可写的 Provider 配置落点（与 classpath 主 application.yml 隔离）。
    # 开发环境默认写到用户主目录下，避免污染源码目录或 jar 内 classpath 资源。
    config-yaml-path: ${APP_AI_CONFIG_YAML_PATH:${user.home}/.interview-guide/llm-providers.yml}
    config-env-path: ${APP_AI_CONFIG_ENV_PATH:${user.home}/.interview-guide/llm-providers.env}
    agent-utils:
      skills-root: ${APP_AI_AGENT_UTILS_SKILLS_ROOT:classpath:skills}
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY}
        model: ${AI_MODEL:qwen3.5-flash}
        embedding-model: text-embedding-v4
        embedding-dimensions: 1536
        supports-embedding: true
      lmstudio:
        base-url: http://localhost:1234
        api-key: ${PROVIDER_LMSTUDIO_API_KEY:lm-studio}
        model: qwen2.5-7b-instruct
        supports-embedding: false
      # ===== 预设 Provider（填完 API Key 后即可使用）=====
      # Moonshot AI / Kimi（OpenAI 兼容） https://platform.moonshot.cn/
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY:}
        model: ${PROVIDER_KIMI_MODEL:kimi-latest}
        temperature: 1
        supports-embedding: false
      # DeepSeek（OpenAI 兼容） https://api-docs.deepseek.com/
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${PROVIDER_DEEPSEEK_API_KEY:}
        model: ${PROVIDER_DEEPSEEK_MODEL:deepseek-v4-flash}
        supports-embedding: false
      # 智谱 AI / GLM（OpenAI 兼容） https://open.bigmodel.cn/
      glm:
        base-url: https://open.bigmodel.cn/api/coding/paas/v4
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_MODEL:glm-5}
        embedding-model: embedding-3
        embedding-dimensions: 1024
        supports-embedding: true
    advisors:
      enabled: ${APP_AI_ADVISORS_ENABLED:true}
      tool-call-enabled: ${APP_AI_ADVISORS_TOOL_CALL_ENABLED:true}
      tool-call-conversation-history-enabled: ${APP_AI_ADVISORS_TOOL_CALL_CONVERSATION_HISTORY_ENABLED:false}
      stream-tool-call-responses: ${APP_AI_ADVISORS_STREAM_TOOL_CALL_RESPONSES:false}
      message-chat-memory-enabled: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_ENABLED:false}
      message-chat-memory-max-messages: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_MAX_MESSAGES:120}
      simple-logger-enabled: ${APP_AI_ADVISORS_SIMPLE_LOGGER_ENABLED:false}
    # 结构化输出重试次数（JSON 解析失败时的业务层重试）
    structured-max-attempts: ${APP_AI_STRUCTURED_MAX_ATTEMPTS:2}
    # 重试时是否将上次错误原因注入提示词，帮助模型定向修复输出
    structured-include-last-error: ${APP_AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
    # 是否启用“修复型重试提示词”（关闭后每次重试沿用原始 system prompt）
    structured-retry-use-repair-prompt: ${APP_AI_STRUCTURED_RETRY_USE_REPAIR_PROMPT:true}
    # 修复型重试提示词中是否追加严格 JSON 指令
    structured-retry-append-strict-json-instruction: ${APP_AI_STRUCTURED_RETRY_APPEND_STRICT_JSON_INSTRUCTION:true}
    # 注入到重试提示词中的错误信息最大长度
    structured-error-message-max-length: ${APP_AI_STRUCTURED_ERROR_MESSAGE_MAX_LENGTH:200}
    # 是否开启结构化输出调用指标（invocations/attempts/latency）
    structured-metrics-enabled: ${APP_AI_STRUCTURED_METRICS_ENABLED:true}
    rag:
      rewrite:
        enabled: ${APP_AI_RAG_REWRITE_ENABLED:true}
        model: ${APP_AI_RAG_REWRITE_MODEL:qwen-max-latest}
      routing:
        model: ${APP_AI_RAG_ROUTING_MODEL:qwen-max-latest}
      search:
        short-query-length: ${APP_AI_RAG_SHORT_QUERY_LENGTH:4}
        topk-short: ${APP_AI_RAG_TOPK_SHORT:20}
        topk-medium: ${APP_AI_RAG_TOPK_MEDIUM:12}
        topk-long: ${APP_AI_RAG_TOPK_LONG:8}
        min-score-short: ${APP_AI_RAG_MIN_SCORE_SHORT:0.18}
        min-score-default: ${APP_AI_RAG_MIN_SCORE_DEFAULT:0.28}
      # 混合检索（对齐 know-engine 默认 hybrid：ES 向量 + BM25/RRF）
      hybrid:
        enabled: ${APP_AI_RAG_HYBRID_ENABLED:true}
        dual-channel: ${APP_AI_RAG_HYBRID_DUAL_CHANNEL:true}
        mode: ${APP_AI_RAG_HYBRID_MODE:hybrid}
        keyword-top-k: ${APP_AI_RAG_HYBRID_KEYWORD_TOPK:20}
        keyword-min-similarity: ${APP_AI_RAG_HYBRID_KEYWORD_MIN_SIM:0.1}
        rrf-k: ${APP_AI_RAG_HYBRID_RRF_K:60}
        fusion-top-k: ${APP_AI_RAG_HYBRID_FUSION_TOPK:12}
      sql:
        enabled: ${APP_AI_RAG_SQL_ENABLED:true}
        router-enabled: ${APP_AI_RAG_SQL_ROUTER_ENABLED:true}
        query-timeout-seconds: ${APP_AI_RAG_SQL_QUERY_TIMEOUT_SECONDS:8}
        max-rows: ${APP_AI_RAG_SQL_MAX_ROWS:100}
      # 重排：默认本地 ONNX BGE-RERANKER（对齐 know-engine）
      rerank:
        enabled: ${APP_AI_RAG_RERANK_ENABLED:true}
        provider: ${APP_AI_RAG_RERANK_PROVIDER:local}
        model: ${APP_AI_RAG_RERANK_MODEL:gte-rerank-v2}
        top-n: ${APP_AI_RAG_RERANK_TOPN:6}
        timeout-ms: ${APP_AI_RAG_RERANK_TIMEOUT_MS:3000}
        # 本地 ONNX reranker 模型文件配置（provider=local 时生效）
        # 模型文件不入 git，需手动下载放到 backend/src/main/resources/model/bge-reranker-model/
        # 详见 backend/src/main/resources/model/bge-reranker-model/README.md
        local:
          model-path: ${APP_AI_RAG_RERANK_LOCAL_MODEL_PATH:classpath:model/bge-reranker-model/model_quantized.onnx}
          tokenizer-path: ${APP_AI_RAG_RERANK_LOCAL_TOKENIZER_PATH:classpath:model/bge-reranker-model/tokenizer.json}
          max-sequence-length: ${APP_AI_RAG_RERANK_LOCAL_MAX_SEQ_LEN:8192}
      # 父子/兄弟分段扩展（small-to-big）：检索命中 chunk 后，按 parentChunkId 取父块章节、
      # 按 brotherChunkId 取同组兄弟按序拼接，给 LLM 更完整上下文（对齐 know-engine）。
      # 开启后每次检索会多一次 segment 表批量查询（按 chunkId / brotherChunkId 命中索引）。
      parent-expand:
        enabled: ${APP_AI_RAG_PARENT_EXPAND_ENABLED:true}
        strategy: ${APP_AI_RAG_PARENT_EXPAND_STRATEGY:replace}
        max-chars: ${APP_AI_RAG_PARENT_EXPAND_MAX_CHARS:1200}
        max-siblings: ${APP_AI_RAG_PARENT_EXPAND_MAX_SIBLINGS:5}
        cache-ttl-seconds: ${APP_AI_RAG_PARENT_EXPAND_CACHE_TTL:30}
      # Neo4j Text2Cypher 图检索（对齐 know-engine graph_db 路由）
      graph:
        enabled: ${APP_AI_RAG_GRAPH_ENABLED:true}
        auto-sync-on-vectorize: ${APP_AI_RAG_GRAPH_AUTO_SYNC:true}
        skill-bootstrap-enabled: ${APP_AI_RAG_GRAPH_SKILL_BOOTSTRAP:true}
        cypher-prompt-path: classpath:prompts/text-to-cypher-prompt.txt
      # RAG 流式生成专用模型（对齐 know-engine qwen3.6-plus）
      generation:
        streaming-model: ${APP_AI_RAG_GENERATION_MODEL:qwen3.6-plus}
        temperature: 0.2
      # 意图识别兜底
      intent-recognition:
        enabled: ${APP_AI_RAG_INTENT_RECOGNITION_ENABLED:true}
        # 是否在意图识别前推"正在理解您的问题..."进度（关闭可省前端空进度）
        progress-enabled: ${APP_AI_RAG_INTENT_RECOGNITION_PROGRESS_ENABLED:true}
        model: ${APP_AI_RAG_INTENT_MODEL:qwen-max-latest}
      title-summary:
        enabled: ${APP_AI_RAG_TITLE_SUMMARY_ENABLED:true}
        model: ${APP_AI_RAG_TITLE_MODEL:qwen3.5-flash}
  interview:
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    evaluation:
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}
  resume:
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  # 钉钉机器人（P2 可选，默认关闭）
  dingtalk:
    enabled: ${APP_DINGTALK_ENABLED:false}
    app-key: ${APP_DINGTALK_APP_KEY:}
    app-secret: ${APP_DINGTALK_APP_SECRET:}
    robot-code: ${APP_DINGTALK_ROBOT_CODE:}
    webhook-token: ${APP_DINGTALK_WEBHOOK_TOKEN:}
    stream-enabled: ${APP_DINGTALK_STREAM_ENABLED:false}
    system-user-id: ${APP_DINGTALK_SYSTEM_USER_ID:}
    default-knowledge-base-ids: ${APP_DINGTALK_DEFAULT_KB_IDS:}

  # RustFS (S3兼容) 存储配置
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${APP_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${APP_STORAGE_BUCKET:interview-guide}
    region: ${APP_STORAGE_REGION:us-east-1}
  
  # CORS配置 - React前端
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:80,http://localhost:28080,http://127.0.0.1:28080}

  # Voice interview configuration
  voice-interview:
    # Phase duration settings (minutes)
    phase:
      intro:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_QUESTIONS:5}
      tech:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_QUESTIONS:3}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_QUESTIONS:8}
      project:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_QUESTIONS:5}
      hr:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_QUESTIONS:5}

    # TTS configuration
    tts:
      default-voice: ${APP_VOICE_INTERVIEW_TTS_DEFAULT_VOICE:siyue}  # 思悦 - 温柔自然的女声

    # Qwen3 Realtime ASR Configuration
    qwen:
      asr:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
        model: qwen3-asr-flash-realtime
        api-key: ${AI_BAILIAN_API_KEY}
        language: zh
        format: pcm
        sample-rate: 16000
        enable-turn-detection: true
        turn-detection-type: server_vad
        turn-detection-threshold: 0.0
        # 静音多久判为一句结束；中文面试思考停顿常见 2-3s，设 2000 避免句中切段
        turn-detection-silence-duration-ms: ${APP_VOICE_ASR_SILENCE_MS:2000}

      # Qwen TTS Realtime Configuration (WebSocket-based)
      # 音色列表文档：https://help.aliyun.com/zh/model-studio/qwen-tts-realtime
      tts:
        model: qwen3-tts-flash-realtime
        api-key: ${AI_BAILIAN_API_KEY}
        voice: Cherry
        format: pcm
        sample-rate: 24000
        mode: commit
        language-type: Chinese
        speech-rate: 1.0
        volume: 60

    # 用户说完一小段 STT 定稿后，再等多久（毫秒）才触发面试官回复；需大于 VAD 静音阈值以确保用户继续说话时 partials 能取消
    user-utterance-debounce-ms: ${APP_VOICE_USER_UTTERANCE_DEBOUNCE_MS:2500}
    # 触发提交前要求的最小静音时长（毫秒），从最后一次 STT 活动（含 partial）算起
    min-silence-before-commit-ms: ${APP_VOICE_MIN_SILENCE_BEFORE_COMMIT_MS:2500}
    # 当内容较短时先不提交，等待继续说（字符数）
    min-commit-chars: ${APP_VOICE_MIN_COMMIT_CHARS:20}
    # 最长等待用户继续补充的时间（毫秒），超时后强制提交
    max-wait-for-continuation-ms: ${APP_VOICE_MAX_WAIT_FOR_CONTINUATION_MS:7000}
    # 语音面试单轮面试官回复最大长度（字符）
    ai-question-max-chars: ${APP_VOICE_AI_QUESTION_MAX_CHARS:120}
    # 是否按句子边合成边推送语音；开启后首段语音不用等待完整回复生成结束
    chunked-audio-enabled: ${APP_VOICE_CHUNKED_AUDIO_ENABLED:true}
    # 单句 TTS 合成超时，避免某一句卡住整轮播放
    tts-timeout-seconds: ${APP_VOICE_TTS_TIMEOUT_SECONDS:8}
    # 单会话并发 TTS 上限，控制首段语音速度和服务连接压力
    max-concurrent-tts-per-session: ${APP_VOICE_MAX_CONCURRENT_TTS_PER_SESSION:3}

    # Rate limiting
    rate-limit:
      max-per-session: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_SESSION:10}  # messages per second
      max-per-ip: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_IP:3}  # interviews per hour
      max-concurrent: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_CONCURRENT:50}  # global concurrent interviews

    # Audio specifications
    audio:
      codec: ${APP_VOICE_INTERVIEW_AUDIO_CODEC:opus}
      sample-rate: ${APP_VOICE_INTERVIEW_AUDIO_SAMPLE_RATE:16000}
      bit-rate: ${APP_VOICE_INTERVIEW_AUDIO_BIT_RATE:24000}
      channels: ${APP_VOICE_INTERVIEW_AUDIO_CHANNELS:1}
