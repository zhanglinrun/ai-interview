# 测试环境配置（对齐 MyBatis-Plus + MySQL 方言，H2 内存库模拟）

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 5

  sql:
    init:
      mode: never

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://localhost:6379"
          database: 0

  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

elasticsearch:
  host: ${ES_HOST:http://localhost:9200}
  index-name: ai-interview-vector
  dimensions: 1536

minio:
  url: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: ai-interview
  endpoint: http://localhost:9000

app:
  capability-content:
    auto-import: false
  algorithm-content:
    auto-import: false
  algorithm:
    judge0:
      enabled: false
  ai:
    default-provider: dashscope
    embedding-dimensions: 1536
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: test-api-key
        model: qwen3.5-flash
        embedding-model: text-embedding-v4
        embedding-dimensions: 1536
        supports-embedding: true
      lmstudio:
        base-url: http://localhost:1234
        api-key: lm-studio
        model: qwen2.5-7b-instruct
        supports-embedding: false
    structured-max-attempts: 2
    structured-include-last-error: true
    rag:
      rewrite:
        enabled: true
      hybrid:
        enabled: true
        mode: hybrid
      rerank:
        provider: local
      search:
        short-query-length: 4
        topk-short: 20
        topk-medium: 12
        topk-long: 8
        min-score-short: 0.18
        min-score-default: 0.28
  interview:
    follow-up-count: 1
    evaluation:
      batch-size: 8
  resume:
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:80
