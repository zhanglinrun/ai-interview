# 测试环境配置（对齐 MyBatis-Plus + MySQL 方言，H2 内存库模拟）

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 5

  sql:
    init:
      mode: never

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://localhost:6379"
          database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

elasticsearch:
  host: ${ES_HOST:http://localhost:9200}
  index-name: ai-interview-vector
  dimensions: 1536

minio:
  url: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: ai-interview
  endpoint: http://localhost:9000

neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: neo4j666


app:
  # 单元测试为纯 Mockito 测试，不加载 Spring 上下文，故此处引擎值不影响普通构建；
  # 引擎取默认 rocketmq（如需跑加载完整上下文的 @SpringBootTest，应另起 broker 或桩化 TaskQueueChannel）。
  async:
    engine: rocketmq
  ai:
    default-provider: dashscope
    embedding-dimensions: 1536
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: test-api-key
        model: qwen3.5-flash
        embedding-model: text-embedding-v4
        embedding-dimensions: 1536
        supports-embedding: true
      lmstudio:
        base-url: http://localhost:1234
        api-key: lm-studio
        model: qwen2.5-7b-instruct
        supports-embedding: false
    structured-max-attempts: 2
    structured-include-last-error: true
    rag:
      rewrite:
        enabled: true
      hybrid:
        enabled: true
        mode: hybrid
      rerank:
        provider: local
      search:
        short-query-length: 4
        topk-short: 20
        topk-medium: 12
        topk-long: 8
        min-score-short: 0.18
        min-score-default: 0.28
  interview:
    follow-up-count: 1
    evaluation:
      batch-size: 8
  resume:
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:80
  voice-interview:
    llm-provider: dashscope
    phase:
      intro:
        min-duration: 3
        suggested-duration: 5
        max-duration: 8
        min-questions: 2
        max-questions: 5
      tech:
        min-duration: 8
        suggested-duration: 10
        max-duration: 15
        min-questions: 3
        max-questions: 8
      project:
        min-duration: 8
        suggested-duration: 10
        max-duration: 15
        min-questions: 2
        max-questions: 5
      hr:
        min-duration: 3
        suggested-duration: 5
        max-duration: 8
        min-questions: 2
        max-questions: 5
    tts:
      default-voice: siyue
    qwen:
      asr:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
        model: qwen3-asr-flash-realtime
        api-key: test-api-key
        language: zh
        format: pcm
        sample-rate: 16000
        enable-turn-detection: true
        turn-detection-type: server_vad
        turn-detection-threshold: 0.0
        turn-detection-silence-duration-ms: 1000
      tts:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
        model: qwen3-tts-flash-realtime
        api-key: test-api-key
        voice: Cherry
        format: pcm
        sample-rate: 16000
        mode: server_commit
        language-type: Chinese
        speech-rate: 1.0
        volume: 60
    user-utterance-debounce-ms: 1600
    rate-limit:
      max-per-session: 10
      max-per-ip: 3
      max-concurrent: 50
    audio:
      codec: opus
      sample-rate: 16000
      bit-rate: 24000
      channels: 1
      chunk-duration: 2000
