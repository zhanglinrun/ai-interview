# 自适应下一题决策回归集。
#
# 该数据集只评估无需 LLM 的决策层：上一答结构信号 -> 跟进动作 -> 目标能力。
# 它不把启发式信号冒充答案正确性；题目质量仍由 Critic bad-case 集与在线评测负责。
# 必须提交到仓库：InterviewTurnDecisionDatasetTest 随普通 mvn test 运行，不能依赖 gitignore 的 /eval/。

cases:
  - id: FIRST_QUESTION
    questionIndex: 0
    mysqlQuestionCount: 1
    expectedAction: SWITCH_TOPIC
    expectedTarget: MySQL
    expectedFollowUp: false

  - id: EXPLICIT_UNCERTAINTY
    questionIndex: 1
    mysqlQuestionCount: 1
    lastAnswer: 这个问题我不清楚，之前也没用过。
    expectedAction: REMEDIATE
    expectedTarget: MySQL
    expectedFollowUp: true

  - id: TOO_SHORT
    questionIndex: 1
    mysqlQuestionCount: 1
    lastAnswer: 加索引会更快。
    expectedAction: CLARIFY
    expectedTarget: MySQL
    expectedFollowUp: true

  - id: LONG_BUT_NO_REASONING
    questionIndex: 1
    mysqlQuestionCount: 1
    lastAnswer: 我在项目里使用了 MySQL 联合索引、覆盖索引、慢查询日志和执行计划，也关注查询耗时、扫描行数以及索引占用空间，平时会持续观察这些指标。
    expectedAction: CLARIFY
    expectedTarget: MySQL
    expectedFollowUp: true

  - id: DEEPEN_SAME_TOPIC
    questionIndex: 1
    mysqlQuestionCount: 2
    lastAnswer: 因为覆盖索引可以直接从二级索引取得列，所以减少了回表。例如项目里的列表查询使用覆盖索引，不过代价是索引空间和写放大会增加。
    expectedAction: DEEPEN
    expectedTarget: MySQL
    expectedFollowUp: true

  - id: SWITCH_AFTER_SUBSTANTIVE_ANSWER
    questionIndex: 1
    mysqlQuestionCount: 1
    lastAnswer: 因为最左前缀决定联合索引的可用范围，所以字段组合要按查询模式设计。例如项目里调整索引后减少了扫描行数，但是写入和存储成本会上升。
    expectedAction: SWITCH_TOPIC
    expectedTarget: Redis
    expectedFollowUp: false

  - id: UNCERTAINTY_OVERRIDES_LENGTH
    questionIndex: 1
    mysqlQuestionCount: 1
    lastAnswer: 我知道事务涉及 ACID、隔离级别、MVCC 和锁，但是具体为什么能避免并发异常我不确定，这部分没有系统实践过，也记不清实现细节。
    expectedAction: REMEDIATE
    expectedTarget: MySQL
    expectedFollowUp: true

  - id: TRADEOFF_COUNTS_AS_DEPTH
    questionIndex: 1
    mysqlQuestionCount: 2
    lastAnswer: 因为提高隔离级别能够减少并发异常，所以一致性更强，但是代价是锁冲突增加和吞吐下降，需要结合业务正确性要求做取舍。
    expectedAction: DEEPEN
    expectedTarget: MySQL
    expectedFollowUp: true

  - id: REASON_WITHOUT_EXAMPLE_OR_TRADEOFF
    questionIndex: 1
    mysqlQuestionCount: 1
    lastAnswer: 因为 B+ 树的非叶子节点只保存键和指针，所以单个节点能容纳更多索引项，因此树高更低，查询磁盘页的次数也会减少，整体查找复杂度比较稳定。
    expectedAction: CLARIFY
    expectedTarget: MySQL
    expectedFollowUp: true

  - id: ENGLISH_MARKERS
    questionIndex: 1
    mysqlQuestionCount: 1
    lastAnswer: Because a covering index avoids the table lookup, it reduced random IO in our project example; however the trade-off was higher write amplification and storage cost.
    expectedAction: SWITCH_TOPIC
    expectedTarget: Redis
    expectedFollowUp: false
