# RAG 检索评测专用 profile
#
# 与默认 test profile 不同，评测必须连真实的 Elasticsearch + MySQL + Redis + DashScope，
# 才能反映线上真实检索表现。通过 @ActiveProfiles("rageval") + @Tag("rag-eval") 隔离，
# 默认不随普通 mvn test 运行。
#
# 运行前提：
#   1. cd dev-ops && docker compose -f docker-compose-environment.yml up -d
#   2. 评测语料已入库（见 eval/rag-retrieval/README.md），知识库 id 通过 ragdataset.kb-* 配置传入
#   3. .env 里 AI_BAILIAN_API_KEY 就绪（embedding 与 rerank 都要用）

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ai_interview}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:ai_interview}
    password: ${MYSQL_PASSWORD:ai_interview}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

elasticsearch:
  host: ${ES_HOST:http://localhost:9200}
  index-name: ai-interview-vector
  dimensions: 1536

# 评测必须保证三档策略真正生效、互相可区分，所以这里显式打开混合检索与重排开关，
# 不依赖主配置默认值。测试里分别调用 similaritySearch / hybridSearch / rerank 三个入口，
# hybridSearch 内部受 app.ai.rag.hybrid.enabled 控制，关闭时会退化成纯向量，失去对比意义。
#
# 第二轮要让 rerank 有足够候选可精排，所以把混合检索的候选规模拉大：
#   keyword-top-k / fusion-top-k 提到 30，rerank top-n 提到 20（从大候选里精排取前若干）。
#   评测代码再从这批候选截断到评分用的 evalTopK（默认 6），体现「精排把好结果顶到前面」。
app:
  ai:
    rag:
      multi-source:
        neo4j:
          enabled: false
      hybrid:
        enabled: true
        keyword-top-k: 30
        fusion-top-k: 30
      rerank:
        enabled: true
        top-n: 20

# 评测数据集配置：语料知识库 id + 评测集路径
# kb-* 的值来自入库后生成的知识库 id（见 eval/rag-retrieval/README.md）
ragdataset:
  dataset-path: classpath:rag-eval/eval-dataset.yaml
  kb-redis: ${RAGEVAL_KB_REDIS:0}
  kb-mysql: ${RAGEVAL_KB_MYSQL:0}
  kb-distributed: ${RAGEVAL_KB_DISTRIBUTED:0}
  kb-jvm: ${RAGEVAL_KB_JVM:0}
  kb-spring: ${RAGEVAL_KB_SPRING:0}
  # 评分用 topK（截断到前 evalTopK 个算 Hit/MRR/NDCG）
  top-k: ${RAGEVAL_TOPK:6}
  # 候选 topK（向量/混合先取这么多候选，rerank 从中精排）
  candidate-top-k: ${RAGEVAL_CANDIDATE_TOPK:20}
  # 输出报告路径
  report-path: ${RAGEVAL_REPORT_PATH:eval/.work/rag-retrieval-report.md}
