# 多源 RAG 路由回归集（独立于 100 题文档生成集）
#
# source=structured 映射到上传的 Excel 关系表（RAGEVAL_KB_STRUCTURED）。
# 同一个知识库请求会按问题意图进入 graph_db、relational_db 或 knowledge_base，
# 用于验证完整链路，而不是把图/SQL 仅当作单元测试绕过 RAG。
# SQL 题的答案是本次评测账号 user_id=4 的快照（导出前数据库中 6 份文档）。

metadata:
  name: multisource-route-suite
  status: assistant_curated_pending_human_review
  purpose: graph_sql_excel_end_to_end_smoke
  corpus_version: rag-platform-relations-xlsx-2026-08-11
  snapshot: user_id=4, documents=6, all_doc_status=VECTOR_STORED

