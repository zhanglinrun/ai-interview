    origin: "corpus_curated"
    corpus_version: "eval-corpus-local-2026-08-11"
    difficulty: "concept"
    question_type: "concept"
    question: "Redis 为什么快"
    query_hard: "同样是数据库，为什么这个内存服务通常比磁盘数据库响应更快？"
    answerable: true
    expected_refusal: false
    reference_answer: "Redis 主要把数据放在内存中，减少磁盘随机 I/O；事件循环和 I/O 多路复用提高连接处理效率；高效数据结构降低了常用操作的复杂度。单线程主要负责命令执行，并不意味着所有网络处理都只能由一个线程完成，实际延迟还受网络、命令复杂度和数据规模影响。"
    review_status: "assistant_curated_pending_human_review"
    key_points:
      - ["内存驻留","内存存储","memory-resident"]
      - ["I/O 多路复用","epoll","kqueue"]
      - ["事件循环","单线程命令执行"]
      - ["高效数据结构","低复杂度"]
    gold_evidence:
      - doc_id: "redis-v2.0"
        section: "4. Redis 为什么快呢？"
        quote: "Redis 会根据操作系统选择最优的 I/O 多路复用技术，并把数据主要放在内存中。"

