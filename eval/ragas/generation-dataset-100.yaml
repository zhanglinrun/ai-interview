# 这是基于 eval/corpus 五类 PDF 的 source-grounded candidate gold 集：每个知识域 20 题，
# 其中 16 题 dev、4 题 holdout；每域含 2 道知识库无答案题。
# reference_answer/gold_evidence 已按语料章节整理，但 review_status 明确标为
# assistant_curated_pending_human_review。完成领域人工复核后，才可改为 human_reviewed 并运行 strict。
# 运行审核规范：eval/ragas/DATASET_REVIEW.md

metadata:
