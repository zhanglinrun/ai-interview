[project]
name = "ai-interview-ragas-eval"
version = "0.1.0"
description = "RAGAS 生成质量评测（faithfulness / answer_relevancy / context_precision / context_recall），对齐 ai-interview 后端 RAG 生成链路"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ragas>=0.2,<0.3",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.2,<0.4",
    "datasets>=2.19",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[tool.uv]
package = false
