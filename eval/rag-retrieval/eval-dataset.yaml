# RAG 检索评测集（检索侧）
#
# 用途：在固定语料下，量化对比「纯向量 / 向量+BM25 混合 / 混合+rerank」三档检索策略
#       的召回与排序质量，为简历指标提供可复现的实验证据。
#
# 语料（fixture，本地准备，不进 git）：5 类 Java 后端面试 PDF
#   - 面渣逆袭Redis篇V2.0.pdf
#   - 面渣逆袭MySQL篇V2.2.pdf
#   - 面渣逆袭-分布式篇.pdf
#   - JVM 方向语料
#   - Spring 方向语料
#   准备方式见同目录 README.md。
#
# 字段说明（ground truth 采用「关键词级 per-chunk 分级相关性」）：
#   id            唯一编号
#   source        期望命中的来源文档（文档级判定）：redis | mysql | distributed | jvm | spring
#   difficulty    难度：fact（直接事实）| concept（概念理解）| synthesis（跨段综合）
#   question      简单查询（贴近原文的面试问法，含关键词）
#   query_hard    困难查询（口语化/场景化问法，刻意避开原文术语，
#                 用于逼出纯向量的漏召回，给混合检索与 rerank 留出发挥空间）
#   key_points    必含关键点组（每组是同义词候选数组，命中其一即算该点命中）。
#                 既用于判定单个 chunk 的「分级相关性」（一个 chunk 覆盖几组 key_point
#                 就是它的相关性等级），也用于整体召回判定。
#
# 审核提示：query_hard 是第二轮新增。判断标准是「真人会不会这么问、且没直接报答案术语」。
#           不合适的直接改。

questions:
  # ==================== Redis（共 21 题：本区 18 + 补充区 3）====================
  - id: redis-01
    source: redis
    difficulty: fact
    question: Redis 支持哪些基本数据类型
    query_hard: 我想在内存数据库里存各种形式的值，它本身原生能放哪几种结构的东西
    key_points:
      - ["字符串", "string"]
      - ["列表", "list"]
      - ["哈希", "hash"]
      - ["集合", "set"]
      - ["有序集合", "zset", "sorted set"]

  - id: redis-02
    source: redis
    difficulty: concept
    question: Redis 为什么快
    query_hard: 同样是数据库，为什么这个东西读写能到微秒级，比传统数据库快那么多
    key_points:
      - ["内存", "基于内存"]
      - ["IO 多路复用", "多路复用", "epoll"]
      - ["单线程", "事件驱动"]

  - id: redis-03
    source: redis
    difficulty: concept
    question: 什么是缓存击穿，怎么解决
    query_hard: 有个访问特别频繁的数据，它在缓存里刚好失效的那一刻，请求一下子全砸到数据库上，怎么避免
    key_points:
      - ["热点", "热点 key", "某个 key"]
      - ["过期", "失效"]
      - ["互斥锁", "分布式锁", "永不过期", "逻辑过期"]

  - id: redis-04
    source: redis
    difficulty: concept
    question: 什么是缓存穿透，如何防止
    query_hard: 有人老是来查一个根本不存在的数据，缓存挡不住，每次都打到库里，怎么处理
    key_points:
      - ["不存在", "数据库中不存在"]
      - ["布隆过滤器", "bloom"]
      - ["缓存空值", "空对象"]

  - id: redis-05
    source: redis
    difficulty: concept
    question: 什么是缓存雪崩
    query_hard: 一大批缓存数据在差不多同一时刻全都没了，数据库瞬间压力暴涨，这种情况叫什么、怎么防
    key_points:
      - ["大量", "大批"]
      - ["同时过期", "集中过期", "同一时间"]
      - ["随机", "过期时间随机", "打散"]

  - id: redis-06
    source: redis
    difficulty: fact
    question: Redis 有哪些持久化方式
    query_hard: 内存里的数据怕断电丢失，这个数据库自己有哪几种把数据落到硬盘的办法
    key_points:
      - ["RDB", "快照"]
      - ["AOF", "追加"]
      - ["混合持久化"]

  - id: redis-07
    source: redis
    difficulty: concept
    question: RDB 和 AOF 有什么区别，宕机后哪种恢复更快
    query_hard: 那两种落盘方案各有什么取舍，机器突然挂了重启的时候哪种把数据捞回来更快
    key_points:
      - ["RDB", "快照"]
      - ["AOF", "命令", "日志"]
      - ["RDB 恢复快", "RDB 更快", "二进制"]

  - id: redis-08
    source: redis
    difficulty: concept
    question: Redis 哨兵机制的作用是什么
    query_hard: 主节点万一挂了，有没有什么角色能自动发现并把某个从节点顶上去，不用人工干预
    key_points:
      - ["监控", "监测"]
      - ["故障转移", "自动切换", "failover"]
      - ["选举", "选主", "新的主节点"]

  - id: redis-09
    source: redis
    difficulty: synthesis
    question: Redis 集群数据是如何分片的
    query_hard: 一份数据量很大，分散放在好几台机器上，它是按什么规则决定某条数据落到哪台的
    key_points:
      - ["槽", "slot", "哈希槽"]
      - ["16384"]
      - ["CRC16", "哈希", "取模"]

  - id: redis-10
    source: redis
    difficulty: concept
    question: Redis 如何用 SETNX 实现分布式锁，有什么问题
    query_hard: 想让多台服务器抢同一把锁保证只有一个能执行，用这个内存数据库怎么做，会踩什么坑
    key_points:
      - ["SETNX", "setnx", "set if not exist"]
      - ["过期时间", "超时"]
      - ["原子", "lua", "锁误删", "续期"]

  - id: redis-11
    source: redis
    difficulty: synthesis
    question: Redisson 的看门狗机制是怎么工作的
    query_hard: 业务还没跑完锁却到期被释放了很危险，那个客户端框架是怎么自动帮我把锁的有效期延下去的
    key_points:
      - ["看门狗", "watchdog"]
      - ["续期", "自动续期", "延长"]
      - ["30", "10 秒", "定时"]

  - id: redis-12
    source: redis
    difficulty: concept
    question: 如何保证缓存和数据库的数据一致性
    query_hard: 数据同时存在缓存和库里，更新的时候怎么操作才不会让两边对不上
    key_points:
      - ["先更新数据库", "更新数据库"]
      - ["删除缓存", "删缓存"]
      - ["延迟双删", "重试", "最终一致"]

  - id: redis-13
    source: redis
    difficulty: fact
    question: Redis 有哪些内存淘汰策略
    query_hard: 内存快满了又有新数据要写，它能按哪些规则决定踢掉哪些老数据
    key_points:
      - ["LRU", "allkeys-lru"]
      - ["LFU", "allkeys-lfu"]
      - ["TTL", "random", "noeviction", "随机"]

  - id: redis-14
    source: redis
    difficulty: concept
    question: Redis 的 key 过期策略有哪些
    query_hard: 给数据设了存活时间，到点之后它具体是怎么被清掉的，是马上删还是怎样
    key_points:
      - ["惰性删除", "惰性"]
      - ["定期删除", "定期"]

  - id: redis-15
    source: redis
    difficulty: synthesis
    question: zset 的底层是怎么实现的，为什么用跳表
    query_hard: 那个能按分数排序还能范围查的结构，内部靠什么数据结构撑起来的，为啥选它
    key_points:
      - ["跳表", "skiplist", "跳跃表"]
      - ["范围查询", "区间", "排序"]
      - ["ziplist", "listpack", "压缩列表"]

  - id: redis-16
    source: redis
    difficulty: concept
    question: 什么是热 Key，怎么处理
    query_hard: 某一个键被疯狂访问，流量全集中在它身上把单个节点压垮了，这种情况怎么应对
    key_points:
      - ["热 key", "热点 key", "高频访问"]
      - ["本地缓存", "多级缓存"]
      - ["分散", "拆分", "副本"]

  - id: redis-17
    source: redis
    difficulty: fact
    question: Redis 支持事务吗，事务能保证原子性吗
    query_hard: 这个内存库能不能把几条命令打包一起执行，中间某条失败了会不会自动撤销前面的
    key_points:
      - ["MULTI", "EXEC", "队列"]
      - ["不支持回滚", "不回滚", "不保证原子"]

  - id: redis-18
    source: redis
    difficulty: concept
    question: Bitmap 适合什么场景
    query_hard: 想用极小的空间记录上亿用户每天有没有签到这种是或否的状态，用哪种结构最省
    key_points:
      - ["位", "二进制位", "bit"]
      - ["签到", "活跃", "状态"]

  # ==================== MySQL（共 19 题：本区 16 + 补充区 3）====================
  - id: mysql-01
    source: mysql
    difficulty: concept
    question: MySQL 的 MVCC 是怎么实现的
    query_hard: 一个事务在读数据的时候，别的事务正在改同一行，它怎么做到读到的是一个不变的旧版本
    key_points:
      - ["版本链", "undo log", "回滚指针"]
      - ["ReadView", "read view", "一致性视图"]
      - ["可见性", "事务 id", "trx_id"]

  - id: mysql-02
    source: mysql
    difficulty: fact
    question: MySQL 事务有哪些隔离级别
    query_hard: 多个事务同时跑会互相干扰，数据库提供了哪几档由松到严的隔离设置
    key_points:
      - ["读未提交", "read uncommitted"]
      - ["读已提交", "read committed"]
      - ["可重复读", "repeatable read"]
      - ["串行化", "serializable"]

  - id: mysql-03
    source: mysql
    difficulty: concept
    question: 为什么 InnoDB 索引用 B+ 树而不用 B 树
    query_hard: 存索引的时候为什么选那种只有叶子放数据、叶子还串成链表的树，而不是每层都放数据的树
    key_points:
      - ["B+ 树", "B+树"]
      - ["叶子节点", "叶子", "数据都在叶子"]
      - ["范围查询", "链表", "树高", "IO"]

  - id: mysql-04
    source: mysql
    difficulty: concept
    question: 聚簇索引和非聚簇索引有什么区别
    query_hard: 有一种索引的叶子直接就是整行数据，另一种叶子只存个主键还要再查一次，这俩差在哪
    key_points:
      - ["聚簇索引", "聚集索引"]
      - ["数据", "数据行", "整行数据"]
      - ["回表", "二级索引", "主键"]

  - id: mysql-05
    source: mysql
    difficulty: concept
    question: 什么是回表，什么情况会触发
    query_hard: 用普通索引查到主键后还得拿主键再去主索引捞一遍完整数据，这个二次查找叫什么、啥时候会发生
    key_points:
      - ["回表"]
      - ["二级索引", "普通索引", "非聚簇"]
      - ["主键", "聚簇索引", "再查一次"]

  - id: mysql-06
    source: mysql
    difficulty: concept
    question: 什么是最左前缀原则
    query_hard: 建了个好几列的联合索引，查询条件得从最左边那列开始连着用才走得上索引，这个规则叫什么
    key_points:
      - ["联合索引", "组合索引"]
      - ["最左", "从左到右", "最左前缀"]
      - ["范围查询", "失效", "中断"]

  - id: mysql-07
    source: mysql
    difficulty: concept
    question: 索引在哪些情况下会失效
    query_hard: 明明建了索引但查询还是走全表扫描，通常是哪些写法把索引给整没用了
    key_points:
      - ["函数", "运算", "计算"]
      - ["最左前缀", "联合索引"]
      - ["like", "%", "类型转换", "or"]

  - id: mysql-08
    source: mysql
    difficulty: fact
    question: MySQL 有哪些日志，redo log 和 binlog 有什么区别
    query_hard: 数据库里负责崩溃恢复的那个日志和负责主从同步的那个日志，分别叫什么、有啥不一样
    key_points:
      - ["redo log", "重做日志"]
      - ["binlog", "归档日志"]
      - ["undo log", "回滚日志"]
      - ["崩溃恢复", "物理日志", "逻辑日志", "主从复制"]

  - id: mysql-09
    source: mysql
    difficulty: synthesis
    question: redo log 的两阶段提交是怎么回事
    query_hard: 为了让那两个日志在崩溃时保持一致，提交的时候为什么要先标记一个中间状态再真正提交
    key_points:
      - ["prepare", "准备"]
      - ["commit", "提交"]
      - ["binlog", "一致性", "崩溃"]

  - id: mysql-10
    source: mysql
    difficulty: concept
    question: MySQL 有哪几种锁
    query_hard: 数据库为了控制并发，从锁整张表到锁一行、再到锁一段范围，都有哪些类型的锁
    key_points:
      - ["表锁", "全局锁"]
      - ["行锁", "记录锁"]
      - ["间隙锁", "临键锁", "next-key", "意向锁"]

  - id: mysql-11
    source: mysql
    difficulty: concept
    question: 什么是幻读，MySQL 怎么解决
    query_hard: 同一个事务里两次查同样的范围，第二次却多出来几行别人刚插的，这种现象叫啥、怎么治
    key_points:
      - ["幻读"]
      - ["间隙锁", "next-key", "临键锁"]
      - ["MVCC", "快照读", "当前读"]

  - id: mysql-12
    source: mysql
    difficulty: concept
    question: 快照读和当前读有什么区别
    query_hard: 普通 select 读到的是历史版本，而加锁的那种查询读到的是最新的，这两种读法分别叫什么
    key_points:
      - ["快照读", "snapshot"]
      - ["当前读", "current read"]
      - ["for update", "lock in share", "最新版本"]

  - id: mysql-13
    source: mysql
    difficulty: fact
    question: 事务的四大特性是什么
    query_hard: 衡量一个事务可靠不可靠，业界公认的那四个基本性质是哪几个
    key_points:
      - ["原子性", "atomicity"]
      - ["一致性", "consistency"]
      - ["隔离性", "isolation"]
      - ["持久性", "durability"]

  - id: mysql-14
    source: mysql
    difficulty: synthesis
    question: 事务的 ACID 是靠什么保证的
    query_hard: 那四个事务特性在底层分别是靠哪些日志和机制落地实现的
    key_points:
      - ["undo log", "原子性"]
      - ["redo log", "持久性"]
      - ["MVCC", "锁", "隔离性"]

  - id: mysql-15
    source: mysql
    difficulty: concept
    question: 如何优化一条慢 SQL
    query_hard: 有条查询跑得特别慢，从哪些方面入手把它调快，常用哪些手段和工具去分析
    key_points:
      - ["索引", "加索引", "覆盖索引"]
      - ["explain", "执行计划"]
      - ["全表扫描", "select *", "分页"]

  - id: mysql-16
    source: mysql
    difficulty: synthesis
    question: 分库分表会带来哪些问题
    query_hard: 把一张大表拆到多个库多张表之后，原来很简单的事务、关联查询、主键生成会变得多麻烦
    key_points:
      - ["分布式事务", "事务"]
      - ["跨库", "跨节点", "join", "分页"]
      - ["主键", "全局 id", "雪花"]

  # ==================== 分布式（共 12 题：dist-01~12 连续）====================
  - id: dist-01
    source: distributed
    difficulty: concept
    question: 说说 CAP 原则
    query_hard: 分布式系统里数据一致、服务可用、能扛住网络断开这三点为什么没法同时全要
    key_points:
      - ["一致性", "Consistency"]
      - ["可用性", "Availability"]
      - ["分区容错", "Partition", "分区容忍"]
      - ["最多", "只能满足", "不可兼得", "三者"]

  - id: dist-02
    source: distributed
    difficulty: concept
    question: BASE 理论是什么
    query_hard: 既然强一致做不到，那套退而求其次、允许中间状态、最后再追平的设计思想叫什么
    key_points:
      - ["基本可用", "Basically Available"]
      - ["软状态", "Soft state"]
      - ["最终一致", "Eventual"]

  - id: dist-03
    source: distributed
    difficulty: fact
    question: 分布式事务有哪些实现方案
    query_hard: 跨好几个服务和库的操作要么一起成功要么一起回滚，业界都有哪些落地方案
    key_points:
      - ["2PC", "两阶段提交"]
      - ["TCC"]
      - ["本地消息表", "MQ", "消息事务", "最大努力通知", "Seata"]

  - id: dist-04
    source: distributed
    difficulty: concept
    question: 说说 2PC 两阶段提交的过程和缺点
    query_hard: 有个协调者先问所有参与方能不能提交、都答应了再统一提交的方案，它怎么跑、有什么毛病
    key_points:
      - ["准备", "prepare", "预提交"]
      - ["提交", "commit"]
      - ["阻塞", "单点", "协调者", "数据不一致"]

  - id: dist-05
    source: distributed
    difficulty: concept
    question: TCC 是怎么实现分布式事务的
    query_hard: 那种每个操作都要写一个尝试、一个确认、一个取消三段补偿逻辑的事务方案是怎么回事
    key_points:
      - ["Try", "尝试"]
      - ["Confirm", "确认"]
      - ["Cancel", "取消"]

  - id: dist-06
    source: distributed
    difficulty: synthesis
    question: 本地消息表是怎么保证最终一致性的
    query_hard: 把要发的消息和业务数据放一个本地事务里先落库，再靠后台定时捞出来投递重试，这套怎么做到不丢
    key_points:
      - ["本地事务", "同一个事务"]
      - ["消息表", "消息"]
      - ["轮询", "定时", "重试", "幂等"]

  - id: dist-07
    source: distributed
    difficulty: concept
    question: 怎么保证接口幂等性
    query_hard: 同一个请求因为重试被发了好几次，怎么保证业务只真正执行一次、不产生重复数据
    key_points:
      - ["唯一索引", "唯一约束"]
      - ["乐观锁", "version", "悲观锁"]
      - ["防重表", "token", "select"]

  - id: dist-08
    source: distributed
    difficulty: concept
    question: 有哪些分布式锁的实现方案
    query_hard: 多台机器要抢同一把锁，除了用内存数据库，还能靠哪些中间件或存储来实现
    key_points:
      - ["Redis", "SETNX", "Redisson"]
      - ["ZooKeeper", "zk", "临时节点"]
      - ["MySQL", "数据库", "唯一"]

  - id: dist-09
    source: distributed
    difficulty: concept
    question: 什么是服务雪崩，如何做熔断和降级
    query_hard: 一个服务挂了把依赖它的上游一个接一个全拖垮，这种连锁故障怎么防，靠什么机制及时断开
    key_points:
      - ["雪崩", "连锁", "级联"]
      - ["熔断", "断路器", "circuit breaker"]
      - ["降级", "限流", "隔离"]

  - id: dist-10
    source: distributed
    difficulty: fact
    question: 常见的限流算法有哪些
    query_hard: 想控制单位时间内放进来的请求数，业界常用哪几种算法来平滑或硬性卡住流量
    key_points:
      - ["计数器", "固定窗口", "滑动窗口"]
      - ["漏桶", "leaky bucket"]
      - ["令牌桶", "token bucket"]

  - id: dist-11
    source: distributed
    difficulty: synthesis
